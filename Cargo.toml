[workspace]
resolver = "3"
members = [
    "crates/core",
    "crates/storage",
    "crates/artifacts",
    "crates/runtime",
    "crates/images",
    "crates/document-parser",
    "crates/search",
    "crates/workers",
    "crates/service",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"
homepage = "https://open-compute.dev"
rust-version = "1.98"
description = "Open Compute local Cloudflare Workers-compatible platform"
publish = false

[workspace.dependencies]
aws-credential-types = "1.2.3"
aws-sdk-s3 = "=1.96.0"
aws-smithy-http-client = { version = "1.0.2", default-features = false, features = ["default-client", "rustls-aws-lc"] }
aws-smithy-runtime-api = "1.7.4"
aws-smithy-types = "1.3.0"
base64 = "0.22.1"
blake3 = "1.8.2"
webpki-root-certs = "1.0.4"
astral-tl = "=0.8.0"
bytes = "1.10.1"
chacha20poly1305 = "0.10.1"
cfb = "0.14.0"
flate2 = "1.1.2"
fallible-iterator = "0.3.0"
futures = "0.3.31"
hex = "0.4.3"
hmac = "0.12.1"
image = { version = "=0.25.10", default-features = false, features = ["jpeg", "png", "webp", "avif"] }
jiff = "0.2.35"
lopdf = { version = "=0.44.0", default-features = false }
md-5 = "0.10.6"
multer = "3.1.0"
sha1 = "0.10.7"
rand = "0.9.2"
rayon = "1.11.0"
regex = "1.13.1"
rusqlite = { version = "0.37.0", features = ["backup", "blob", "bundled", "hooks", "limits"] }
rustix = { version = "1.1.2", features = ["alloc", "fs"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = { version = "1.0.145", features = ["raw_value"] }
sha2 = "0.10.9"
thiserror = "2.0.17"
# `unstable_wasm` selects tokenizers' pure-Rust fancy-regex backend. Keep
# default features off so production has no HTTP, Oniguruma, or C++ tokenizer path.
tokenizers = { version = "=0.20.4", default-features = false, features = ["unstable_wasm"] }
axum = { version = "0.8.4", default-features = false, features = ["http1", "json", "matched-path", "multipart", "query", "tokio", "ws"] }
hyper = { version = "1.7.0", features = ["client", "http1"] }
hyper-rustls = { version = "0.27.9", default-features = false, features = ["aws-lc-rs", "http1", "tls12", "webpki-tokio"] }
hyper-util = { version = "0.1.16", features = ["client", "client-legacy", "http1", "tokio"] }
http-body-util = "0.1.3"
httpdate = "1.0.3"
clap = { version = "4.5.45", features = ["derive"] }
subtle = "2.6.1"
tokio = { version = "1.47.1", features = ["fs", "io-util", "macros", "net", "process", "rt-multi-thread", "signal", "sync", "time"] }
tracing = "0.1.41"
tracing-subscriber = { version = "0.3.20", features = ["env-filter", "fmt", "json"] }
toml = "0.9.5"
url = "2.5.7"
uuid = { version = "1.18.1", features = ["serde", "v7"] }
unicode-normalization = "0.1.24"
zeroize = { version = "1.8.1", features = ["derive"] }
xberg = { version = "=1.0.14", default-features = false, features = ["tokio-runtime", "pdf", "office", "excel", "xml"] }
zip = { version = "=8.6.0", default-features = false, features = ["deflate-flate2"] }

[workspace.lints.rust]
elided_lifetimes_in_paths = "deny"
missing_debug_implementations = "deny"
missing_docs = "deny"
rust_2018_idioms = { level = "deny", priority = -1 }
unreachable_pub = "warn"
unsafe_code = "forbid"
unused_must_use = "deny"
unused_qualifications = "deny"

[workspace.lints.clippy]
cloned_instead_of_copied = "deny"
dbg_macro = "deny"
doc_markdown = "deny"
explicit_iter_loop = "deny"
manual_let_else = "deny"
map_unwrap_or = "deny"
match_same_arms = "allow"
needless_pass_by_value = "deny"
redundant_closure_for_method_calls = "deny"
semicolon_if_nothing_returned = "deny"
trivially_copy_pass_by_ref = "deny"
uninlined_format_args = "deny"
unnecessary_wraps = "deny"

# Keep verified archive expansion and hashing fast in development and tests.
# Workspace code and debug/overflow checks retain the standard dev settings.
[profile.dev.package.miniz_oxide]
opt-level = 3

[profile.dev.package.sha2]
opt-level = 3

[profile.release]
lto = true
codegen-units = 1
panic = "abort"
strip = "symbols"

[profile.release-with-debug]
inherits = "release"
debug = true
strip = "none"
