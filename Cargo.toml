[workspace]
resolver = "3"
members = [
    "crates/core",
    "crates/storage",
    "crates/artifacts",
    "crates/runtime",
    "crates/workers",
    "crates/service",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"
rust-version = "1.98"
description = "Open Compute local Cloudflare Workers-compatible platform"
publish = false

[workspace.dependencies]
aws-credential-types = "1.2.3"
aws-sdk-s3 = "=1.96.0"
aws-smithy-http-client = { version = "1.0.2", default-features = false, features = ["default-client", "rustls-aws-lc"] }
aws-smithy-runtime-api = "1.7.4"
aws-smithy-types = "1.3.0"
base64 = "0.22.1"
webpki-root-certs = "1.0.4"
bytes = "1.10.1"
chacha20poly1305 = "0.10.1"
flate2 = "1.1.2"
futures = "0.3.31"
hex = "0.4.3"
hmac = "0.12.1"
ipnet = "2.11.0"
rand = "0.9.2"
rusqlite = { version = "0.37.0", features = ["bundled"] }
rustix = { version = "1.1.2", features = ["alloc", "fs"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.145"
sha2 = "0.10.9"
thiserror = "2.0.17"
axum = { version = "0.8.4", default-features = false, features = ["http1", "json", "tokio"] }
hyper = { version = "1.7.0", features = ["client", "http1"] }
hyper-util = { version = "0.1.16", features = ["client", "client-legacy", "http1", "tokio"] }
http-body-util = "0.1.3"
clap = { version = "4.5.45", features = ["derive"] }
subtle = "2.6.1"
tokio = { version = "1.47.1", features = ["fs", "io-util", "macros", "net", "rt-multi-thread", "signal", "sync", "time"] }
tracing = "0.1.41"
tracing-subscriber = { version = "0.3.20", features = ["env-filter", "fmt", "json"] }
toml = "0.9.5"
url = "2.5.7"
uuid = { version = "1.18.1", features = ["serde", "v7"] }
unicode-normalization = "0.1.24"
zeroize = { version = "1.8.1", features = ["derive"] }

[workspace.lints.rust]
elided_lifetimes_in_paths = "deny"
missing_debug_implementations = "deny"
missing_docs = "deny"
rust_2018_idioms = { level = "deny", priority = -1 }
unreachable_pub = "warn"
unsafe_code = "forbid"
unused_must_use = "deny"
unused_qualifications = "deny"

[workspace.lints.clippy]
cloned_instead_of_copied = "deny"
dbg_macro = "deny"
doc_markdown = "deny"
explicit_iter_loop = "deny"
manual_let_else = "deny"
map_unwrap_or = "deny"
match_same_arms = "allow"
needless_pass_by_value = "deny"
redundant_closure_for_method_calls = "deny"
semicolon_if_nothing_returned = "deny"
trivially_copy_pass_by_ref = "deny"
uninlined_format_args = "deny"
unnecessary_wraps = "deny"

[profile.release]
lto = true
codegen-units = 1
panic = "abort"
strip = "symbols"

[profile.release-with-debug]
inherits = "release"
debug = true
strip = "none"
