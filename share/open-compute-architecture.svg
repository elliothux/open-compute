<svg xmlns="http://www.w3.org/2000/svg" xml:lang="en" width="2200" height="1280" viewBox="0 0 2200 1280" role="img" aria-labelledby="title desc">
  <title id="title">open-compute single-node multi-tenant Workers platform architecture</title>
  <desc id="desc">A three-column architecture diagram. External clients, developer tooling, and the public network sit on the left. The single deployment unit containing ocd and a supervised stock workerd process sits in the center. Local SQLite state and external S3-compatible object storage sit on the right.</desc>

  <defs>
    <marker id="arrow" markerWidth="14" markerHeight="14" refX="12" refY="7" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0 0 14 7 0 14Z" fill="#596575"/>
    </marker>
    <marker id="arrow-teal" markerWidth="15" markerHeight="15" refX="13" refY="7.5" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0 0 15 7.5 0 15Z" fill="#0f8f80"/>
    </marker>
    <marker id="arrow-teal-start" markerWidth="15" markerHeight="15" refX="2" refY="7.5" orient="auto-start-reverse" markerUnits="userSpaceOnUse">
      <path d="M0 0 15 7.5 0 15Z" fill="#0f8f80"/>
    </marker>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="5" stdDeviation="7" flood-color="#1a2940" flood-opacity="0.10"/>
    </filter>
    <style>
      .canvas { fill: #f7f8fb; }
      .title { font: 800 40px Inter, ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif; fill: #142033; letter-spacing: .1px; }
      .subtitle { font: 400 18px Inter, ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif; fill: #647084; letter-spacing: .2px; }
      .eyebrow { font: 750 13px Inter, ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif; letter-spacing: 1.6px; }
      .node-title { font: 750 25px Inter, ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif; fill: #172033; }
      .node-subtitle { font: 500 16px Inter, ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif; fill: #465269; }
      .body { font: 400 16px Inter, ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif; fill: #344055; }
      .body-small { font: 400 14px Inter, ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif; fill: #536078; }
      .module-title { font: 700 18px Inter, ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif; fill: #172033; }
      .module-body { font: 400 14px Inter, ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif; fill: #526078; }
      .label { font: italic 14px Inter, ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif; fill: #445065; }
      .chip { font: 650 13px Inter, ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif; fill: #27364d; }
      .badge { font: 800 13px Inter, ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif; fill: #ffffff; text-anchor: middle; dominant-baseline: central; letter-spacing: .6px; }
      .legend { font: 500 13px Inter, ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif; fill: #3d4960; }
      .edge { fill: none; stroke: #596575; stroke-width: 2.8; marker-end: url(#arrow); }
      .edge-thin { fill: none; stroke: #7c8797; stroke-width: 2.2; marker-end: url(#arrow); }
      .edge-auth { fill: none; stroke: #0f8f80; stroke-width: 3.5; marker-start: url(#arrow-teal-start); marker-end: url(#arrow-teal); }
      .edge-label { fill: #ffffff; stroke: #d5dae3; stroke-width: 1.2; }
    </style>
  </defs>

  <rect class="canvas" width="2200" height="1280"/>

  <text class="title" x="1100" y="58" text-anchor="middle">open-compute — Single-node multi-tenant Workers platform</text>
  <text class="subtitle" x="1100" y="96" text-anchor="middle">Single ocd distribution · Rust control/data plane + supervised stock workerd · SQLite authority + external S3 · no Redis / Postgres / sidecar</text>

  <!-- Center deployment boundary -->
  <rect x="450" y="144" width="1180" height="962" rx="30" fill="#ffffff" stroke="#b6c0cf" stroke-width="2"/>
  <rect x="486" y="132" width="522" height="26" rx="13" fill="#f7f8fb"/>
  <text class="eyebrow" x="502" y="150" fill="#6f7b8f">SINGLE DEPLOYMENT UNIT · ONE CONFIG · ONE LIFECYCLE</text>

  <!-- Left column: external actors -->
  <g filter="url(#shadow)">
    <rect x="60" y="210" width="300" height="170" rx="24" fill="#ffe7d6" stroke="#e67d55" stroke-width="2.5"/>
  </g>
  <rect x="82" y="231" width="44" height="28" rx="8" fill="#d9653e"/>
  <text class="badge" x="104" y="245">06</text>
  <text class="eyebrow" x="144" y="251" fill="#a6482b">EXTERNAL</text>
  <text class="node-title" x="210" y="295" text-anchor="middle">Clients / Operators</text>
  <text class="body" x="210" y="333" text-anchor="middle">HTTP · CLI · deployment API</text>
  <text class="body-small" x="210" y="360" text-anchor="middle">only public entry point</text>

  <g filter="url(#shadow)">
    <rect x="60" y="450" width="300" height="240" rx="24" fill="#fff2c8" stroke="#d8a62e" stroke-width="2.5"/>
  </g>
  <rect x="82" y="471" width="44" height="28" rx="8" fill="#b8860b"/>
  <text class="badge" x="104" y="485">05</text>
  <text class="eyebrow" x="144" y="491" fill="#8a650a">BUILD TIME</text>
  <text class="node-title" x="210" y="536" text-anchor="middle">Developer toolchain</text>
  <text class="body" x="210" y="576" text-anchor="middle">oc · TypeScript 7 · Rolldown</text>
  <text class="body" x="210" y="608" text-anchor="middle">vinext / framework output</text>
  <text class="body-small" x="210" y="646" text-anchor="middle">typecheck · bundle · asset manifest</text>
  <text class="body-small" x="210" y="674" text-anchor="middle">never in the production startup path</text>

  <g filter="url(#shadow)">
    <rect x="60" y="800" width="300" height="190" rx="24" fill="#e8f1ff" stroke="#4f79b9" stroke-width="2.5"/>
  </g>
  <rect x="82" y="821" width="44" height="28" rx="8" fill="#315f9e"/>
  <text class="badge" x="104" y="835">07</text>
  <text class="eyebrow" x="144" y="841" fill="#315f9e">EGRESS</text>
  <text class="node-title" x="210" y="886" text-anchor="middle">Public network</text>
  <text class="body" x="210" y="924" text-anchor="middle">fetch · sockets · connect()</text>
  <text class="body-small" x="210" y="954" text-anchor="middle">public-address-only</text>
  <text class="body-small" x="210" y="978" text-anchor="middle">private / loopback / metadata denied</text>

  <!-- ocd host authority -->
  <g filter="url(#shadow)">
    <rect x="490" y="188" width="1100" height="350" rx="26" fill="#173653" stroke="#102c46" stroke-width="3"/>
  </g>
  <rect x="522" y="216" width="48" height="30" rx="8" fill="#38a3c8"/>
  <text class="badge" x="546" y="231">01</text>
  <text x="1040" y="235" text-anchor="middle" style="font:750 27px Inter,ui-sans-serif,system-ui,-apple-system,'Segoe UI',sans-serif;fill:#ffffff">ocd — Rust host authority</text>
  <text x="1040" y="269" text-anchor="middle" style="font:500 16px Inter,ui-sans-serif,system-ui,-apple-system,'Segoe UI',sans-serif;fill:#c9d9e7">sole public/control listener · data-dir owner · deployment / scheduler / runtime lifecycle</text>

  <rect x="530" y="298" width="310" height="125" rx="17" fill="#f5f8fc"/>
  <text class="module-title" x="685" y="332" text-anchor="middle">Ingress + Control API</text>
  <text class="module-body" x="685" y="363" text-anchor="middle">routing · admin auth · health</text>
  <text class="module-body" x="685" y="389" text-anchor="middle">trusted identity · header sanitization</text>

  <rect x="875" y="298" width="310" height="125" rx="17" fill="#f5f8fc"/>
  <text class="module-title" x="1030" y="332" text-anchor="middle">Deployment authority</text>
  <text class="module-body" x="1030" y="363" text-anchor="middle">resource catalog · immutable pins</text>
  <text class="module-body" x="1030" y="389" text-anchor="middle">binding resolution · artifact verification</text>

  <rect x="1220" y="298" width="330" height="125" rx="17" fill="#f5f8fc"/>
  <text class="module-title" x="1385" y="332" text-anchor="middle">Scheduler + Workflows</text>
  <text class="module-body" x="1385" y="363" text-anchor="middle">Queues · Cron · alarms · workflow steps</text>
  <text class="module-body" x="1385" y="389" text-anchor="middle">leases · run tokens · crash recovery</text>

  <rect x="540" y="463" width="210" height="44" rx="11" fill="#2b5070"/>
  <text x="645" y="490" text-anchor="middle" style="font:650 13px Inter,ui-sans-serif,system-ui,-apple-system,'Segoe UI',sans-serif;fill:#e9f2f9">SQLite manager</text>
  <rect x="790" y="463" width="210" height="44" rx="11" fill="#2b5070"/>
  <text x="895" y="490" text-anchor="middle" style="font:650 13px Inter,ui-sans-serif,system-ui,-apple-system,'Segoe UI',sans-serif;fill:#e9f2f9">SigV4 S3 adapter</text>
  <rect x="1040" y="463" width="210" height="44" rx="11" fill="#2b5070"/>
  <text x="1145" y="490" text-anchor="middle" style="font:650 13px Inter,ui-sans-serif,system-ui,-apple-system,'Segoe UI',sans-serif;fill:#e9f2f9">binding backend</text>
  <rect x="1290" y="463" width="250" height="44" rx="11" fill="#2b5070"/>
  <text x="1415" y="490" text-anchor="middle" style="font:650 13px Inter,ui-sans-serif,system-ui,-apple-system,'Segoe UI',sans-serif;fill:#e9f2f9">workerd supervisor</text>

  <!-- Authenticated internal channel -->
  <path class="edge-auth" d="M1040 538 L1040 650"/>
  <rect x="1080" y="570" width="374" height="50" rx="9" fill="#e7f7f4" stroke="#9bd4cb" stroke-width="1.4"/>
  <text class="label" x="1267" y="590" text-anchor="middle">authenticated loopback · generation-scoped token</text>
  <text class="label" x="1267" y="610" text-anchor="middle">dispatch · binding adapters · readiness</text>

  <!-- stock workerd -->
  <g filter="url(#shadow)">
    <rect x="490" y="650" width="1100" height="370" rx="26" fill="#d8f3ec" stroke="#167c6a" stroke-width="3"/>
  </g>
  <rect x="522" y="679" width="48" height="30" rx="8" fill="#168674"/>
  <text class="badge" x="546" y="694">02</text>
  <text class="node-title" x="1040" y="700" text-anchor="middle">verified stock workerd — supervised child process</text>
  <text class="node-subtitle" x="1040" y="734" text-anchor="middle">compiled Cap'n Proto config · trusted system Workers · isolated tenant execution</text>

  <rect x="530" y="766" width="310" height="126" rx="17" fill="#c4ddf3" stroke="#527ca5" stroke-width="1.8"/>
  <text class="module-title" x="685" y="801" text-anchor="middle">Trusted system Workers</text>
  <text class="module-body" x="685" y="832" text-anchor="middle">gateway / assets / resource adapters</text>
  <text class="module-body" x="685" y="858" text-anchor="middle">capability-scoped internal Fetchers</text>

  <rect x="875" y="766" width="370" height="126" rx="17" fill="#f4fbf8" stroke="#428e80" stroke-width="1.8" stroke-dasharray="8 6"/>
  <text class="module-title" x="1060" y="801" text-anchor="middle">WorkerLoader tenant isolates</text>
  <text class="module-body" x="1060" y="832" text-anchor="middle">immutable account / worker / deployment key</text>
  <text class="module-body" x="1060" y="858" text-anchor="middle">env exposes declared bindings only</text>

  <rect x="1280" y="766" width="270" height="126" rx="17" fill="#ffe8c8" stroke="#d39a4e" stroke-width="1.8"/>
  <text class="module-title" x="1415" y="801" text-anchor="middle">Native runtime</text>
  <text class="module-body" x="1415" y="832" text-anchor="middle">DO / facets / localDisk</text>
  <text class="module-body" x="1415" y="858" text-anchor="middle">Node APIs · fetch · sockets</text>

  <rect x="530" y="930" width="1020" height="58" rx="14" fill="#bce7dc"/>
  <rect x="548" y="944" width="170" height="30" rx="9" fill="#f4fbf8"/>
  <text class="chip" x="633" y="964" text-anchor="middle">Workers + Assets</text>
  <rect x="735" y="944" width="160" height="30" rx="9" fill="#f4fbf8"/>
  <text class="chip" x="815" y="964" text-anchor="middle">Service / RPC</text>
  <rect x="912" y="944" width="182" height="30" rx="9" fill="#f4fbf8"/>
  <text class="chip" x="1003" y="964" text-anchor="middle">KV · R2 · D1 · DO</text>
  <rect x="1111" y="944" width="235" height="30" rx="9" fill="#f4fbf8"/>
  <text class="chip" x="1228" y="964" text-anchor="middle">Queues · Cron · Workflows</text>
  <rect x="1363" y="944" width="169" height="30" rx="9" fill="#f4fbf8"/>
  <text class="chip" x="1447" y="964" text-anchor="middle">Cache · Images · Meta</text>

  <rect x="490" y="1048" width="1100" height="38" rx="11" fill="#fff0ee" stroke="#d96d64" stroke-width="1.5"/>
  <text class="body-small" x="1040" y="1072" text-anchor="middle">TENANT TRUST BOUNDARY · no SQLite paths · no S3 credentials · no control API · no internal token or topology</text>

  <!-- Right column: state authorities -->
  <g filter="url(#shadow)">
    <rect x="1740" y="190" width="400" height="450" rx="26" fill="#e8e3f7" stroke="#7866aa" stroke-width="2.5"/>
  </g>
  <rect x="1764" y="214" width="48" height="30" rx="8" fill="#6f59a5"/>
  <text class="badge" x="1788" y="229">03</text>
  <text class="eyebrow" x="1830" y="235" fill="#655193">LOCAL AUTHORITY</text>
  <text class="node-title" x="1940" y="282" text-anchor="middle">Local data-dir</text>
  <text class="node-subtitle" x="1940" y="318" text-anchor="middle">single-writer SQLite authority</text>

  <text class="module-title" x="1784" y="372">control.sqlite</text>
  <text class="body-small" x="1784" y="400">accounts · workers · deployments · routes</text>
  <text class="body-small" x="1784" y="425">resource metadata · encrypted secret refs</text>

  <text class="module-title" x="1784" y="474">scheduler.sqlite</text>
  <text class="body-small" x="1784" y="502">queues · cron · workflows · leases</text>
  <text class="body-small" x="1784" y="527">runtime projections · retry / recovery state</text>

  <text class="module-title" x="1784" y="576">resource persistence</text>
  <text class="body-small" x="1784" y="604">KV / D1 SQLite · workerd DO localDisk</text>
  <text class="body-small" x="1784" y="629">master key · WAL · data-dir lock</text>

  <g filter="url(#shadow)">
    <rect x="1740" y="740" width="400" height="280" rx="26" fill="#f7e2d4" stroke="#c67b57" stroke-width="2.5"/>
  </g>
  <rect x="1764" y="764" width="48" height="30" rx="8" fill="#b96843"/>
  <text class="badge" x="1788" y="779">04</text>
  <text class="eyebrow" x="1830" y="785" fill="#9a5336">EXTERNAL STORAGE</text>
  <text class="node-title" x="1940" y="832" text-anchor="middle">S3-compatible storage</text>
  <text class="node-subtitle" x="1940" y="868" text-anchor="middle">external object-byte authority</text>
  <text class="body" x="1784" y="912">• content-addressed Worker bundles</text>
  <text class="body" x="1784" y="946">• Static Assets + R2 object bytes</text>
  <text class="body" x="1784" y="980">• isolated prefixes · verified admission</text>
  <text class="body-small" x="1940" y="1006" text-anchor="middle">tenant never receives S3 credentials</text>

  <!-- Edges across the wider column gaps -->
  <path class="edge" d="M360 292 C410 292 440 292 490 292"/>
  <rect class="edge-label" x="384" y="254" width="94" height="30" rx="7"/>
  <text class="label" x="431" y="274" text-anchor="middle">public HTTP</text>

  <path class="edge" d="M360 565 C410 565 438 470 530 390"/>
  <rect class="edge-label" x="378" y="468" width="112" height="50" rx="7"/>
  <text class="label" x="434" y="489" text-anchor="middle">bundle / assets</text>
  <text class="label" x="434" y="509" text-anchor="middle">deployment</text>

  <path class="edge" d="M530 840 C454 840 420 895 360 895"/>
  <rect class="edge-label" x="375" y="823" width="126" height="50" rx="7"/>
  <text class="label" x="438" y="844" text-anchor="middle">Network</text>
  <text class="label" x="438" y="864" text-anchor="middle">allow = public</text>

  <path class="edge" d="M1590 350 L1740 350"/>
  <rect class="edge-label" x="1610" y="306" width="112" height="31" rx="7"/>
  <text class="label" x="1666" y="327" text-anchor="middle">transactions</text>

  <path class="edge-thin" d="M1590 830 L1682 830 L1682 580 L1740 580"/>
  <rect class="edge-label" x="1640" y="614" width="112" height="50" rx="7"/>
  <text class="label" x="1696" y="635" text-anchor="middle">native DO</text>
  <text class="label" x="1696" y="655" text-anchor="middle">localDisk</text>

  <path class="edge" d="M1540 485 C1615 485 1644 535 1644 610 L1644 875 L1740 875"/>
  <rect class="edge-label" x="1603" y="785" width="82" height="31" rx="7"/>
  <text class="label" x="1644" y="806" text-anchor="middle">SigV4</text>

  <!-- Distinct bottom key -->
  <rect x="60" y="1152" width="2080" height="72" rx="18" fill="#ffffff" stroke="#d9dee7" stroke-width="1.5"/>
  <text class="eyebrow" x="88" y="1180" fill="#68758a">ARCHITECTURE KEY</text>

  <circle cx="300" cy="1187" r="8" fill="#173653"/>
  <text class="legend" x="318" y="1192">ocd authority</text>

  <circle cx="470" cy="1187" r="8" fill="#168674"/>
  <text class="legend" x="488" y="1192">workerd runtime</text>

  <circle cx="668" cy="1187" r="8" fill="#527ca5"/>
  <text class="legend" x="686" y="1192">trusted system Worker</text>

  <circle cx="906" cy="1187" r="8" fill="#6f59a5"/>
  <text class="legend" x="924" y="1192">local state</text>

  <circle cx="1050" cy="1187" r="8" fill="#b96843"/>
  <text class="legend" x="1068" y="1192">external object storage</text>

  <circle cx="1282" cy="1187" r="8" fill="#d9653e"/>
  <text class="legend" x="1300" y="1192">external / build-time</text>

  <line x1="1490" y1="1187" x2="1536" y2="1187" stroke="#0f8f80" stroke-width="3.5" marker-end="url(#arrow-teal)"/>
  <text class="legend" x="1550" y="1192">authenticated internal channel</text>

  <rect x="1822" y="1178" width="36" height="18" rx="6" fill="#fff0ee" stroke="#d96d64" stroke-width="1.5"/>
  <text class="legend" x="1872" y="1192">tenant trust boundary</text>

  <text class="body-small" x="1100" y="1260" text-anchor="middle">Cloudflare API/config and pinned stock workerd define compatibility · vinext is an application workload, not a platform-specific runtime</text>
</svg>
