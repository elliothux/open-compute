# Example operator config. Secrets are referenced, never inlined.

[server]
public_bind = "127.0.0.1:8787"

[storage]
data_dir = "/var/lib/open-compute"
master_key_file = "/var/lib/open-compute/keys/master.key"
sqlite_busy_timeout_ms = 5000
free_space_soft_bytes = 1073741824
free_space_hard_bytes = 268435456

[hardening]
max_workers_per_account = 1000
max_routes_per_account = 10000
max_deployments_per_worker = 1000
max_resources_per_kind_per_account = 1000
emergency_reserve_bytes = 67108864
max_snapshot_files = 1000000
max_snapshot_file_bytes = 68719476736
max_snapshot_total_bytes = 1099511627776
max_snapshot_manifest_bytes = 8388608
snapshot_staging_margin_bytes = 67108864
incomplete_snapshot_grace_ms = 86400000
snapshot_stale_after_ms = 604800000
max_support_bundle_bytes = 33554432

[s3]
endpoint = "https://s3.example.com"
region = "auto"
bucket = "open-compute"
force_path_style = true
access_key_id_env = "S3_ACCESS_KEY_ID"
secret_access_key_env = "S3_SECRET_ACCESS_KEY"
prefix = "system/"
r2_prefix = "tenant/r2/"

[runtime]
startup_timeout_ms = 20000
shutdown_grace_ms = 10000

[cache]
max_bytes = 10737418240
high_watermark_ratio = 0.9
low_watermark_ratio = 0.8
partial_grace_ms = 3600000
max_artifact_bytes = 536870912

[response_cache]
max_object_bytes = 16777216
max_bytes_per_worker = 1073741824
max_header_bytes = 32768
max_variants_per_key = 32
max_tags_per_entry = 64
max_cache_name_bytes = 128
max_url_bytes = 8192
max_connections = 128
busy_timeout_ms = 250
request_timeout_ms = 5000
refresh_lease_ms = 30000
max_ttl_seconds = 604800
fail_open = true

[images]
max_input_bytes = 20971520
max_output_bytes = 20971520
max_pixels = 40000000
max_dimension = 12000
max_operations = 16
max_overlays = 8
max_frames = 1
max_sessions = 64
max_temp_bytes = 134217728
session_ttl_ms = 60000
max_concurrency = 4
max_concurrency_per_account = 2
request_timeout_ms = 10000

[document_parser]
max_input_bytes = 4194304
max_batch_bytes = 33554432
max_batch_files = 16
max_output_bytes = 16777216
max_concurrency = 4
max_concurrency_per_account = 2
max_concurrency_per_deployment = 1
request_timeout_ms = 30000
max_address_space_bytes = 2147483648
max_cpu_seconds = 30
max_stderr_bytes = 65536

[ai]
max_provider_in_flight = 16
max_embedding_inputs_per_batch = 96
max_embedding_request_bytes = 2097152
max_embedding_response_bytes = 16777216
provider_timeout_ms = 30000
query_timeout_ms = 15000

[metrics]
enabled = true
max_label_value_bytes = 64
max_series = 1024

[workers]
max_bundle_bytes = 17825792
max_request_body_bytes = 16777216
delete_drain_timeout_ms = 5000
artifact_gc_grace_ms = 86400000
artifact_gc_interval_ms = 60000
delete_recovery_batch = 64
retain_ready_deployments = 10
retain_rejected_deployments = 10
deployment_min_retention_ms = 86400000

[kv]
namespace_quota_bytes = 1073741824
max_connections = 64
max_readers_per_namespace = 2
max_active_streams = 16
max_active_streams_per_namespace = 4
idle_handle_ttl_ms = 60000
operation_timeout_ms = 30000

[r2]
max_object_bytes = 536870912
max_concurrent_uploads = 4
max_concurrent_downloads = 16
max_staging_bytes = 2147483648
max_metadata_head_concurrency = 8
operation_timeout_ms = 30000
cursor_ttl_ms = 900000

[d1]
database_quota_bytes = 1073741824
max_open_databases = 32
max_queued_operations_per_database = 64
max_result_rows = 10000
max_result_bytes = 8388608
max_vm_steps = 10000000
query_timeout_ms = 30000
batch_timeout_ms = 30000
idle_handle_ttl_ms = 60000

[queues]
default_max_backlog_bytes = 1073741824
max_in_flight_requests = 64
max_in_flight_requests_per_binding = 8
max_consumer_concurrency = 32

[durable_objects]
max_namespace_name_bytes = 128
max_object_name_bytes = 1024
max_fetch_body_bytes = 33554432
dispatch_timeout_ms = 30000
max_in_flight_dispatches = 256
disk_high_watermark_percent = 85
disk_stop_writes_percent = 95
reconcile_batch = 64

[scheduler]
poll_interval_ms = 100
max_in_flight = 16
claim_lease_ms = 60000
dispatch_timeout_ms = 30000
lease_guard_ms = 5000
repair_batch = 100
repair_interval_ms = 30000
shutdown_drain_ms = 10000
cron_misfire_grace_ms = 300000
cron_max_retries = 3
cron_history_limit = 100
cron_history_retention_ms = 604800000

[scheduler.pools.alarm]
enabled = true
max_in_flight = 16
claim_batch = 32
weight = 1

[scheduler.pools.queue]
enabled = true
max_in_flight = 32
claim_batch = 32
weight = 1

[scheduler.pools.cron]
enabled = true
max_in_flight = 8
claim_batch = 8
weight = 1

[scheduler.pools.workflow]
enabled = true
max_in_flight = 16
claim_batch = 16
weight = 1

[workflows]
max_in_flight_requests = 64
max_steps = 1024
max_state_bytes = 33554432
max_instances_per_account = 10000
max_instances_per_definition = 10000
max_active_per_account = 1000
max_account_state_bytes = 1073741824
lease_ms = 60000
heartbeat_ms = 20000
dispatch_timeout_ms = 300000
recovery_backoff_ms = 1000
creation_grace_ms = 60000
max_parallel_steps = 4
max_buffered_events = 128
max_event_bytes = 8388608

[workflows.default_retention]
successRetentionMs = 604800000
errorRetentionMs = 2592000000
