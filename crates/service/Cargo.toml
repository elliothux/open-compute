[package]
name = "open-compute-service"
version.workspace = true
edition.workspace = true
license.workspace = true
homepage.workspace = true
rust-version.workspace = true
description = "Open Compute daemon, health, doctor, and CLI"
publish.workspace = true
build = "build.rs"

[features]
default = []
test-support = [
    "open-compute-core/test-support",
    "open-compute-storage/test-support",
    "open-compute-artifacts/test-support",
    "open-compute-runtime/test-support",
    "open-compute-workers/test-support",
]

[dependencies]
axum.workspace = true
base64.workspace = true
blake3.workspace = true
bytes.workspace = true
clap.workspace = true
futures.workspace = true
hex.workspace = true
hmac.workspace = true
md-5.workspace = true
multer.workspace = true
sha1.workspace = true
http-body-util.workspace = true
httpdate.workspace = true
jiff.workspace = true
hyper.workspace = true
hyper-rustls.workspace = true
hyper-util.workspace = true
open-compute-artifacts = { path = "../artifacts" }
open-compute-core = { path = "../core" }
open-compute-document-parser = { path = "../document-parser" }
open-compute-images = { path = "../images" }
open-compute-runtime = { path = "../runtime" }
open-compute-search = { path = "../search" }
open-compute-storage = { path = "../storage" }
open-compute-workers = { path = "../workers" }
rayon.workspace = true
rand.workspace = true
regex.workspace = true
rustix = { workspace = true, features = ["alloc", "fs", "process"] }
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
subtle.workspace = true
tokio.workspace = true
tokenizers.workspace = true
toml.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
url.workspace = true
uuid.workspace = true

[build-dependencies]
hex.workspace = true
sha2.workspace = true

[dev-dependencies]
base64.workspace = true
futures.workspace = true
hex.workspace = true
hmac.workspace = true
image.workspace = true
open-compute-artifacts = { path = "../artifacts", features = ["test-support"] }
open-compute-core = { path = "../core", features = ["test-support"] }
open-compute-runtime = { path = "../runtime", features = ["test-support"] }
open-compute-storage = { path = "../storage", features = ["test-support"] }
open-compute-workers = { path = "../workers", features = ["test-support"] }
rusqlite.workspace = true
tempfile.workspace = true
tokio = { workspace = true, features = ["macros", "rt-multi-thread", "net", "signal"] }
tower = { workspace = true, features = ["util"] }

[[bin]]
name = "ocd"
path = "src/bin/ocd.rs"

[[test]]
name = "p5_search_gate"
path = "tests/p5_search_gate.rs"
required-features = ["test-support"]

[[test]]
name = "p0_1_gate"
path = "tests/p0_1_gate/mod.rs"
required-features = ["test-support"]

[[test]]
name = "p0_2_runtime_gate"
path = "tests/p0_2_runtime_gate/mod.rs"
required-features = ["test-support"]

[[test]]
name = "p0_3_resource_binding_gate"
path = "tests/p0_3_resource_binding_gate/mod.rs"
required-features = ["test-support"]

[[test]]
name = "p0_7_durable_objects_gate"
path = "tests/p0_7_durable_objects_gate/mod.rs"
required-features = ["test-support"]

[[test]]
name = "p0_8_scheduler_do_alarms_gate"
path = "tests/p0_8_scheduler_do_alarms_gate/mod.rs"
required-features = ["test-support"]

[[test]]
name = "p0_exit_gate"
path = "tests/p0_exit_gate/mod.rs"
required-features = ["test-support"]

[[test]]
name = "p1_snapshot_restore"
path = "tests/p1_snapshot_restore/mod.rs"
required-features = ["test-support"]

[[test]]
name = "p3_cache_images_gate"
path = "tests/p3_cache_images_gate/mod.rs"
required-features = ["test-support"]

[[test]]
name = "p3_services_product"
path = "tests/p3_services_product/mod.rs"
required-features = ["test-support"]

[[test]]
name = "p6_wrangler_resource_gate"
path = "tests/p6_wrangler_resource_gate/mod.rs"
required-features = ["test-support"]

[[test]]
name = "workflow_runtime_gate"
path = "tests/workflow_runtime_gate/mod.rs"
required-features = ["test-support"]

[lints]
workspace = true
