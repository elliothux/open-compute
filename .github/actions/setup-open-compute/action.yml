name: Set up open-compute
description: Install pinned toolchains, restore caches, and prepare release-pinned runtime inputs

inputs:
  rust-components:
    description: Extra rustup components (comma-separated)
    required: false
    default: ""
  python:
    description: Install Python 3.12
    required: false
    default: "true"
  node:
    description: Install Node.js (bun install cache is a separate step)
    required: false
    default: "true"
  sccache:
    description: Cache Rust compilation in GitHub Actions (CI only)
    required: false
    default: "false"
  rust-cache-key:
    description: Cache compiled third-party crates under this build-kind key (empty disables)
    required: false
    default: ""
  rust-cache-target:
    description: Cargo target directory that rust-cache saves, relative to the workspace
    required: false
    default: target
  llvm-cov:
    description: Install cargo-llvm-cov
    required: false
    default: "false"
  zig:
    description: Install pinned zig and cargo-zigbuild for Linux release packaging
    required: false
    default: "false"
  browser-fixture:
    description: Explicitly download and prepare the pinned chrome-headless-shell test input
    required: false
    default: "false"

runs:
  using: composite
  steps:
    - name: Initialize pinned build source submodules
      shell: bash
      run: git submodule update --init --depth 1 third_party/gitserver third_party/workerd

    - name: Set up Python
      if: ${{ inputs.python == 'true' }}
      uses: actions/setup-python@v7
      with:
        python-version: "3.12"

    - name: Set up Bun
      uses: oven-sh/setup-bun@v2
      with:
        bun-version: 1.3.14

    - name: Set up Node
      if: ${{ inputs.node == 'true' }}
      uses: actions/setup-node@v7
      with:
        node-version: 26.8.1

    - name: Cache bun install
      uses: actions/cache@v6
      with:
        path: ~/.bun/install/cache
        key: ${{ runner.os }}-bun-${{ hashFiles('bun.lock') }}
        restore-keys: ${{ runner.os }}-bun-

    - name: Install locked JavaScript tooling
      shell: bash
      run: bun install --frozen-lockfile --ignore-scripts

    - name: Fetch pinned workerd source and workers-types revisions
      shell: bash
      run: |
        set -euo pipefail
        revisions="$(bun -e '
          const lock = await Bun.file("packages/runtime/workerd.lock.json").json();
          const revisions = [lock.revision, lock.workersTypes.gitHead];
          if (!revisions.every(revision => typeof revision === "string" && /^[0-9a-f]{40}$/.test(revision)))
            throw new Error("invalid pinned workerd or workers-types revision");
          console.log([...new Set(revisions)].join("\n"));
        ')"
        while IFS= read -r revision; do
          if ! git -C third_party/workerd cat-file -e "${revision}^{commit}" 2>/dev/null; then
            git -C third_party/workerd fetch --depth 1 origin "$revision"
          fi
          git -C third_party/workerd cat-file -e "${revision}^{commit}"
        done <<< "$revisions"

    - name: Install Rust toolchain
      uses: dtolnay/rust-toolchain@master
      with:
        toolchain: 1.98.0
        components: ${{ inputs.rust-components }}

    # Restores dependency artifacts and registry downloads; workspace crates still rebuild.
    - name: Cache compiled Rust dependencies
      if: ${{ inputs.rust-cache-key != '' }}
      uses: Swatinem/rust-cache@v2.9.3
      with:
        shared-key: ${{ inputs.rust-cache-key }}-${{ runner.os }}-${{ runner.arch }}
        workspaces: ". -> ${{ inputs.rust-cache-target }}"
        cache-bin: "false"

    - name: Cache Cargo downloads
      if: ${{ inputs.rust-cache-key == '' }}
      uses: actions/cache@v6
      with:
        path: |
          ~/.cargo/registry/index
          ~/.cargo/registry/cache
          ~/.cargo/git/db
        key: ${{ runner.os }}-cargo-downloads-${{ hashFiles('Cargo.lock') }}
        restore-keys: |
          ${{ runner.os }}-cargo-downloads-

    - name: Set up compiler cache
      if: ${{ inputs.sccache == 'true' }}
      uses: mozilla-actions/sccache-action@v0.0.11
      with:
        version: v0.16.0

    - name: Enable compiler cache
      if: ${{ inputs.sccache == 'true' }}
      shell: bash
      run: |
        echo "SCCACHE_GHA_ENABLED=true" >> "$GITHUB_ENV"
        echo "RUSTC_WRAPPER=sccache" >> "$GITHUB_ENV"
        echo "CARGO_INCREMENTAL=0" >> "$GITHUB_ENV"
        # Start with cache credentials before the Broker clears the Gate environment.
        SCCACHE_GHA_ENABLED=true SCCACHE_IDLE_TIMEOUT=0 sccache --start-server

    - name: Install cargo-llvm-cov
      if: ${{ inputs.llvm-cov == 'true' }}
      uses: taiki-e/install-action@cargo-llvm-cov

    # package-release.ts links Linux ocd against the glibc baseline with
    # `cargo zigbuild`; both tools are build-time only.
    - name: Install pinned zig and cargo-zigbuild
      if: ${{ inputs.zig == 'true' && runner.os == 'Linux' }}
      shell: bash
      run: |
        set -euo pipefail
        case "$(uname -m)" in
          x86_64)
            zig=x86_64-linux zig_sha256=24aeeec8af16c381934a6cd7d95c807a8cb2cf7df9fa40d359aa884195c4716c
            zigbuild=x86_64-unknown-linux-gnu zigbuild_sha256=32581c8e13f27a807bb244aaaac870522f5b51263c766cf77b1a99771ce9fa5c ;;
          aarch64)
            zig=aarch64-linux zig_sha256=f7a654acc967864f7a050ddacfaa778c7504a0eca8d2b678839c21eea47c992b
            zigbuild=aarch64-unknown-linux-gnu zigbuild_sha256=70bb4c9cc71a6d16211b9079996e3cd588671053312adeff4d043499ed887601 ;;
          *) echo 'zig is pinned only for Linux x86_64 and aarch64' >&2; exit 1 ;;
        esac
        tools="$RUNNER_TEMP/open-compute-zig"
        mkdir -p "$tools/bin"
        curl --fail --location --output "$tools/zig.tar.xz" \
          "https://ziglang.org/download/0.14.1/zig-$zig-0.14.1.tar.xz"
        printf '%s  %s\n' "$zig_sha256" "$tools/zig.tar.xz" | shasum -a 256 --check
        curl --fail --location --output "$tools/cargo-zigbuild.tar.xz" \
          "https://github.com/rust-cross/cargo-zigbuild/releases/download/v0.24.1/cargo-zigbuild-$zigbuild.tar.xz"
        printf '%s  %s\n' "$zigbuild_sha256" "$tools/cargo-zigbuild.tar.xz" | shasum -a 256 --check
        tar -xJf "$tools/zig.tar.xz" -C "$tools"
        tar -xJf "$tools/cargo-zigbuild.tar.xz" -C "$tools/bin" --strip-components=1 \
          "cargo-zigbuild-$zigbuild/cargo-zigbuild"
        ln -s "../zig-$zig-0.14.1/zig" "$tools/bin/zig"
        echo "$tools/bin" >> "$GITHUB_PATH"
        test "$("$tools/bin/zig" version)" = 0.14.1
        test "$("$tools/bin/cargo-zigbuild" --version)" = 'cargo-zigbuild 0.24.1'

    - name: Use local temporary storage
      shell: bash
      run: echo "TMPDIR=/tmp" >> "$GITHUB_ENV"

    - name: Download and verify pinned runtime inputs
      shell: bash
      run: |
        set -euo pipefail
        bun scripts/prepare-workerd.ts --dest "${RUNNER_TEMP}/open-compute-build-workerd" --download >> "$GITHUB_ENV"
        bun scripts/prepare-caddy.ts --dest "${RUNNER_TEMP}/open-compute-build-caddy" --download >> "$GITHUB_ENV"

    - name: Download and verify chrome-headless-shell fixture
      if: ${{ inputs.browser-fixture == 'true' }}
      shell: bash
      run: |
        set -euo pipefail
        case "$(uname -s):$(uname -m)" in
          Darwin:arm64) target=darwin-arm64 ;;
          Linux:x86_64) target=linux-x64 ;;
          Linux:aarch64) target=linux-arm64 ;;
          *) echo 'This CI fixture requires an explicitly pinned host target' >&2; exit 1 ;;
        esac
        lock="$PWD/test/browser-fixture.lock.json"
        platform=$(jq -er --arg target "$target" '.targets[$target].platform' "$lock")
        url=$(jq -er --arg target "$target" '.targets[$target].url' "$lock")
        sha256=$(jq -er --arg target "$target" '.targets[$target].sha256' "$lock")
        mkdir -p "$PWD/.temp"
        fixture=$(mktemp -d "$PWD/.temp/browser-fixture-XXXXXXXX")
        curl --fail --location --output "$fixture/archive.zip" "$url"
        printf '%s  %s\n' "$sha256" "$fixture/archive.zip" | shasum -a 256 --check
        unzip -q "$fixture/archive.zip" -d "$fixture/source"
        python3 scripts/ci-browser-apparmor.py allow \
          "$fixture/prepared/chrome-headless-shell" >> "$GITHUB_ENV"
        bun scripts/prepare-browser.ts \
          --source "$fixture/source/chrome-headless-shell-$platform/chrome-headless-shell" \
          --dest "$fixture/prepared" >> "$GITHUB_ENV"
