name: Set up open-compute
description: Install pinned toolchains, restore caches, and prepare release-pinned runtime inputs

inputs:
  rust-components:
    description: Extra rustup components (comma-separated)
    required: false
    default: ""
  python:
    description: Install Python 3.12
    required: false
    default: "true"
  node:
    description: Install Node.js (bun install cache is a separate step)
    required: false
    default: "true"
  sccache:
    description: Cache Rust compilation in GitHub Actions (CI only)
    required: false
    default: "false"
  llvm-cov:
    description: Install cargo-llvm-cov
    required: false
    default: "false"
  browser-fixture:
    description: Explicitly download and prepare the pinned chrome-headless-shell test input
    required: false
    default: "false"

runs:
  using: composite
  steps:
    - name: Initialize pinned build source submodules
      shell: bash
      run: git submodule update --init --depth 1 third_party/gitserver third_party/workerd

    - name: Set up Python
      if: ${{ inputs.python == 'true' }}
      uses: actions/setup-python@v7
      with:
        python-version: "3.12"

    - name: Set up Bun
      uses: oven-sh/setup-bun@v2
      with:
        bun-version: 1.3.14

    - name: Set up Node
      if: ${{ inputs.node == 'true' }}
      uses: actions/setup-node@v7
      with:
        node-version: 26.8.1

    - name: Cache bun install
      uses: actions/cache@v6
      with:
        path: ~/.bun/install/cache
        key: ${{ runner.os }}-bun-${{ hashFiles('bun.lock') }}
        restore-keys: ${{ runner.os }}-bun-

    - name: Install locked JavaScript tooling
      shell: bash
      run: bun install --frozen-lockfile --ignore-scripts

    - name: Fetch pinned workerd source and workers-types revisions
      shell: bash
      run: |
        set -euo pipefail
        revisions="$(bun -e '
          const lock = await Bun.file("packages/runtime/workerd.lock.json").json();
          const revisions = [lock.revision, lock.workersTypes.gitHead];
          if (!revisions.every(revision => typeof revision === "string" && /^[0-9a-f]{40}$/.test(revision)))
            throw new Error("invalid pinned workerd or workers-types revision");
          console.log([...new Set(revisions)].join("\n"));
        ')"
        while IFS= read -r revision; do
          if ! git -C third_party/workerd cat-file -e "${revision}^{commit}" 2>/dev/null; then
            git -C third_party/workerd fetch --depth 1 origin "$revision"
          fi
          git -C third_party/workerd cat-file -e "${revision}^{commit}"
        done <<< "$revisions"

    - name: Install Rust toolchain
      uses: dtolnay/rust-toolchain@master
      with:
        toolchain: 1.98.0
        components: ${{ inputs.rust-components }}

    - name: Cache Cargo downloads
      uses: actions/cache@v6
      with:
        path: |
          ~/.cargo/registry/index
          ~/.cargo/registry/cache
          ~/.cargo/git/db
        key: ${{ runner.os }}-cargo-downloads-${{ hashFiles('Cargo.lock') }}
        restore-keys: |
          ${{ runner.os }}-cargo-downloads-

    - name: Set up compiler cache
      if: ${{ inputs.sccache == 'true' }}
      uses: mozilla-actions/sccache-action@v0.0.11
      with:
        version: v0.16.0

    - name: Enable compiler cache
      if: ${{ inputs.sccache == 'true' }}
      shell: bash
      run: |
        echo "SCCACHE_GHA_ENABLED=true" >> "$GITHUB_ENV"
        echo "RUSTC_WRAPPER=sccache" >> "$GITHUB_ENV"
        echo "CARGO_INCREMENTAL=0" >> "$GITHUB_ENV"
        # Start with cache credentials before the Broker clears the Gate environment.
        SCCACHE_GHA_ENABLED=true SCCACHE_IDLE_TIMEOUT=0 sccache --start-server

    - name: Install cargo-llvm-cov
      if: ${{ inputs.llvm-cov == 'true' }}
      uses: taiki-e/install-action@cargo-llvm-cov

    - name: Use local temporary storage
      shell: bash
      run: echo "TMPDIR=/tmp" >> "$GITHUB_ENV"

    - name: Download and verify pinned runtime inputs
      shell: bash
      run: |
        set -euo pipefail
        bun scripts/prepare-workerd.ts --dest "${RUNNER_TEMP}/open-compute-build-workerd" --download >> "$GITHUB_ENV"
        bun scripts/prepare-caddy.ts --dest "${RUNNER_TEMP}/open-compute-build-caddy" --download >> "$GITHUB_ENV"

    - name: Download and verify chrome-headless-shell fixture
      if: ${{ inputs.browser-fixture == 'true' }}
      shell: bash
      run: |
        set -euo pipefail
        case "$(uname -s):$(uname -m)" in
          Darwin:arm64) target=darwin-arm64 ;;
          Linux:x86_64) target=linux-x64 ;;
          Linux:aarch64) target=linux-arm64 ;;
          *) echo 'This CI fixture requires an explicitly pinned host target' >&2; exit 1 ;;
        esac
        lock="$PWD/test/browser-fixture.lock.json"
        platform=$(jq -er --arg target "$target" '.targets[$target].platform' "$lock")
        url=$(jq -er --arg target "$target" '.targets[$target].url' "$lock")
        sha256=$(jq -er --arg target "$target" '.targets[$target].sha256' "$lock")
        mkdir -p "$PWD/.temp"
        fixture=$(mktemp -d "$PWD/.temp/browser-fixture-XXXXXXXX")
        curl --fail --location --output "$fixture/archive.zip" "$url"
        printf '%s  %s\n' "$sha256" "$fixture/archive.zip" | shasum -a 256 --check
        unzip -q "$fixture/archive.zip" -d "$fixture/source"
        python3 scripts/ci-browser-apparmor.py allow \
          "$fixture/prepared/chrome-headless-shell" >> "$GITHUB_ENV"
        bun scripts/prepare-browser.ts \
          --source "$fixture/source/chrome-headless-shell-$platform/chrome-headless-shell" \
          --dest "$fixture/prepared" >> "$GITHUB_ENV"
