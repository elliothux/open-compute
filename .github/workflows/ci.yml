name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  failfast:
    runs-on: ubuntu-24.04
    outputs:
      scope: ${{ steps.scope.outputs.scope }}
      components: ${{ steps.scope.outputs.components }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - name: Classify changed files
        id: scope
        env:
          BASE_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          PYTHONDONTWRITEBYTECODE=1 python3 -m unittest discover -s test -p 'test_ci_scope.py'
          PYTHONDONTWRITEBYTECODE=1 python3 test/ci_scope.py \
            --base "$BASE_SHA" --head "$HEAD_SHA" >> "$GITHUB_OUTPUT"
      - name: Validate source identity and stress contracts
        run: |
          bun test/conformance/check.ts --case baseline-identity
          node --test test/stress.test.mjs

  checks:
    # Fast development checks. Full acceptance is owned by the release workflow.
    needs: failfast
    if: needs.failfast.outputs.scope == 'full'
    strategy:
      fail-fast: false
      matrix:
        include:
          - suite: core
            rust_components: rustfmt
          - suite: clippy
            rust_components: clippy
          - suite: production
            rust_components: ""
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          lfs: true
      - uses: ./.github/actions/setup-open-compute
        with:
          rust-components: ${{ matrix.rust_components }}
      - name: Build and typecheck current runtime and tooling assets
        run: bun run build
      - name: Fast JavaScript and Gate tooling tests
        if: matrix.suite == 'core'
        run: |
          bun run test:js:ci
          PYTHONDONTWRITEBYTECODE=1 python3 -m unittest discover -s test -p 'test_gate.py'
      - name: Service installation permissions and umask regression
        if: matrix.suite == 'core'
        run: mbx test --locked -p open-compute-service --lib service_manager::tests -- --test-threads=1
      - name: SDK package pack inspection and isolated consumer smoke
        if: matrix.suite == 'core'
        run: bun packages/sdk/scripts/inspect-package.ts
      - name: fmt
        if: matrix.suite == 'core'
        run: mbx fmt --all --check
      - name: clippy
        if: matrix.suite == 'clippy'
        run: ./test/check-rust-clippy.sh
      - name: no-default-features
        if: matrix.suite == 'core'
        run: mbx check --workspace --no-default-features
      - name: Rust 1.98 workspace and target compile check
        if: matrix.suite == 'core'
        run: mbx +1.98.0 check --workspace --all-targets
      - name: metadata
        if: matrix.suite == 'core'
        run: mbx metadata --no-deps --format-version 1
      - name: Fetch locked crates for offline production checks
        if: matrix.suite == 'production'
        run: mbx fetch --locked
      - name: Production feature and artifact hygiene
        if: matrix.suite == 'production'
        run: ./test/check-production.py
      - name: dependency boundaries
        if: matrix.suite == 'core'
        run: ./test/check-boundaries.sh

  frontend-checks:
    needs: failfast
    if: needs.failfast.outputs.scope == 'frontend'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - uses: actions/setup-node@v7
        with:
          node-version: 26.8.1
      - uses: actions/cache@v6
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-${{ hashFiles('bun.lock') }}
          restore-keys: ${{ runner.os }}-bun-
      - name: Install locked JavaScript dependencies
        run: bun install --frozen-lockfile --ignore-scripts
      - name: Check changed frontend packages
        env:
          COMPONENTS: ${{ needs.failfast.outputs.components }}
        run: |
          set -euo pipefail
          case ",$COMPONENTS," in
            *,sdk,*|*,dashboard,*) bun run --filter @open-compute/sdk build ;;
          esac
          case ",$COMPONENTS," in
            *,sdk,*)
              bun run --filter @open-compute/sdk typecheck
              bun run --filter @open-compute/sdk test
              bun packages/sdk/scripts/inspect-package.ts
              ;;
          esac
          case ",$COMPONENTS," in
            *,dashboard,*)
              bun run --filter @open-compute/dashboard format:check
              bun run --filter @open-compute/dashboard lint
              bun run --filter @open-compute/dashboard test
              bun run --filter @open-compute/dashboard build
              ;;
          esac
          case ",$COMPONENTS," in
            *,website,*) bun run --filter @open-compute/website build ;;
          esac
          case ",$COMPONENTS," in
          esac
          case ",$COMPONENTS," in
            *,docs,*) bun scripts/check-docs.ts ;;
          esac

  gateway-caddy-module:
    needs: failfast
    if: needs.failfast.outputs.scope == 'full'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          lfs: true
      - name: Initialize pinned source submodules
        run: git submodule update --init --depth 1 third_party/caddy third_party/gitserver third_party/workerd
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - name: Install locked JavaScript tooling
        run: bun install --frozen-lockfile --ignore-scripts
      - name: Download and verify pinned runtime inputs
        run: |
          mkdir -p "$PWD/.temp/runtime-inputs"
          bun scripts/prepare-workerd.ts --dest "$PWD/.temp/runtime-inputs/workerd" --download >> "$GITHUB_ENV"
          bun scripts/prepare-caddy.ts --dest "$PWD/.temp/runtime-inputs/caddy" --download >> "$GITHUB_ENV"
      - name: Prepare exact embedded inputs for the Docker runtime build
        run: |
          bun scripts/build-workerd.ts
          bun run --filter @open-compute/sdk build
          bun run --filter @open-compute/dashboard build
          bun run --filter @open-compute/runtime build
      - name: Build and validate the custom Caddy module in Docker
        run: docker build --file test/gateway/Dockerfile --tag open-compute-gateway-caddy-test .
      - name: Run ocd and its embedded Caddy in an isolated Docker build
        run: docker build --file test/gateway/runtime.Dockerfile --tag open-compute-gateway-runtime-test .

  docs-checks:
    needs: failfast
    if: needs.failfast.outputs.scope == 'docs'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - name: Check documentation links and mirrors
        run: bun scripts/check-docs.ts

  release-tooling-checks:
    needs: failfast
    if: needs.failfast.outputs.scope == 'release-tooling'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - uses: actions/cache@v6
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-${{ hashFiles('bun.lock') }}
          restore-keys: ${{ runner.os }}-bun-
      - name: Install locked JavaScript dependencies
        run: bun install --frozen-lockfile --ignore-scripts
      - name: Check release tooling and documentation
        run: |
          node_modules/.bin/tsc --project scripts/tsconfig.json --noEmit
          node_modules/.bin/prettier --check --ignore-unknown \
            .github/workflows/release*.yml \
            docs/references/releasing.md \
            docs/references/ci-build-performance.md \
            scripts/assemble-release.ts \
            test/release-tools.test.mjs
          bun scripts/check-docs.ts

  ai-search-qualification:
    if: github.ref == 'refs/heads/main' && (github.event_name == 'workflow_dispatch' || github.event_name == 'push')
    runs-on: ubuntu-24.04
    environment: ai-search-qualification
    steps:
      - uses: actions/checkout@v7
        with:
          lfs: true
      - uses: ./.github/actions/setup-open-compute
      - name: Build current runtime and application assets
        run: bun run build
      - name: Fetch locked Rust dependencies
        run: mbx fetch --locked
      - name: Run local AI Search Gate
        run: ./test/gate.py p5-search --jobs 1
      - name: Require protected provider configuration
        env:
          BAILIAN_API_HOST: ${{ secrets.BAILIAN_API_HOST }}
          BAILIAN_API_KEY: ${{ secrets.BAILIAN_API_KEY }}
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          COHERE_API_KEY: ${{ secrets.COHERE_API_KEY }}
        run: |
          set -euo pipefail
          test -n "$BAILIAN_API_HOST"
          test -n "$BAILIAN_API_KEY"
          test -n "$DEEPSEEK_API_KEY"
          test -n "$COHERE_API_KEY"
      - name: Run live AI provider qualification
        env:
          BAILIAN_API_HOST: ${{ secrets.BAILIAN_API_HOST }}
          BAILIAN_API_KEY: ${{ secrets.BAILIAN_API_KEY }}
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          COHERE_API_KEY: ${{ secrets.COHERE_API_KEY }}
        run: ./test/gate.py p5-ai-provider-qualification --jobs 1
      # The harness redacts provider credentials from captured case output, and
      # Actions masks registered secrets; retained tmp/ evidence is never uploaded.
      - name: Show AI provider qualification diagnostics
        if: failure()
        run: |
          shopt -s nullglob
          for log in .temp/gate-run/failed/*/round-*/p5-ai-provider-qualification/output.log \
            .temp/gate-run/failed/*/prepare/p5-ai-provider-qualification/output.log; do
            echo "=== $log"
            cat "$log"
          done
          for report in .temp/gate-run/failed/*/report.json; do
            echo "=== $report"
            jq '{status, error, results}' "$report"
          done
      - name: Upload AI provider qualification evidence
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: ai-provider-qualification-failed-${{ github.run_attempt }}
          path: |
            .temp/gate-run/failed/*/*.json
            .temp/gate-run/failed/*/*.log
            .temp/gate-run/failed/*/*/*/*.log
          if-no-files-found: ignore
          retention-days: 14

  s3-provider-qualification:
    if: github.ref == 'refs/heads/main' && (github.event_name == 'workflow_dispatch' || github.event_name == 'push')
    runs-on: ubuntu-24.04
    environment: s3-provider-qualification
    steps:
      - uses: actions/checkout@v7
        with:
          lfs: true
      - uses: ./.github/actions/setup-open-compute
        with:
          python: "false"
          node: "false"
      - name: Fetch locked Rust dependencies
        run: mbx fetch --locked
      - name: Run production S3 preflight against hosted R2
        env:
          OPEN_COMPUTE_TEST_R2_S3_ENDPOINT: ${{ secrets.OPEN_COMPUTE_TEST_R2_S3_ENDPOINT }}
          OPEN_COMPUTE_TEST_R2_S3_REGION: ${{ secrets.OPEN_COMPUTE_TEST_R2_S3_REGION }}
          OPEN_COMPUTE_TEST_R2_S3_BUCKET: ${{ secrets.OPEN_COMPUTE_TEST_R2_S3_BUCKET }}
          OPEN_COMPUTE_TEST_R2_S3_ACCESS_KEY_ID: ${{ secrets.OPEN_COMPUTE_TEST_R2_S3_ACCESS_KEY_ID }}
          OPEN_COMPUTE_TEST_R2_S3_SECRET_ACCESS_KEY: ${{ secrets.OPEN_COMPUTE_TEST_R2_S3_SECRET_ACCESS_KEY }}
          OPEN_COMPUTE_TEST_R2_S3_MUTATION_ACK: ${{ secrets.OPEN_COMPUTE_TEST_R2_S3_MUTATION_ACK }}
        run: ./test/gate.py s3-provider-qualification --jobs 1

      - name: Upload S3 provider qualification failure evidence
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: s3-provider-qualification-failed-${{ github.run_attempt }}
          path: |
            .temp/gate-run/failed/*/*.json
            .temp/gate-run/failed/*/*.log
            .temp/gate-run/failed/*/*/*/*.log
          if-no-files-found: ignore
          retention-days: 14

  ci:
    if: ${{ always() && !cancelled() }}
    needs:
      [
        failfast,
        checks,
        frontend-checks,
        docs-checks,
        release-tooling-checks,
        gateway-caddy-module,
        ai-search-qualification,
        s3-provider-qualification,
      ]
    runs-on: ubuntu-24.04
    steps:
      - name: Require development checks
        env:
          SCOPE: ${{ needs.failfast.outputs.scope }}
        run: |
          set -euo pipefail
          test "${{ needs.failfast.result }}" = success
          if [ "${{ github.event_name }}" != pull_request ]; then
            test "${{ needs.ai-search-qualification.result }}" = success
            test "${{ needs.s3-provider-qualification.result }}" = success
          fi
          case "$SCOPE" in
            full)
              test "${{ needs.checks.result }}" = success
              test "${{ needs.gateway-caddy-module.result }}" = success
              ;;
            frontend) test "${{ needs.frontend-checks.result }}" = success ;;
            docs) test "${{ needs.docs-checks.result }}" = success ;;
            release-tooling) test "${{ needs.release-tooling-checks.result }}" = success ;;
            *) echo "unknown CI scope: $SCOPE" >&2; exit 1 ;;
          esac
