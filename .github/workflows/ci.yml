name: ci

on:
  push:
  pull_request:

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  msrv:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.98.0
      - uses: Swatinem/rust-cache@v2
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - name: Install locked build tooling
        run: bun install --frozen-lockfile --ignore-scripts
      - name: Build untracked runtime and toolchain assets from this checkout
        run: bun run build
      - name: Prepare explicitly pinned embedded build input
        run: bun scripts/prepare-workerd.ts --dest "$RUNNER_TEMP/open-compute-build-runtime" --download >> "$GITHUB_ENV"
      - name: MSRV 1.98 check
        run: cargo check --workspace --all-targets

  lint-test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-14]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - uses: actions/setup-node@v4
        with:
          node-version: 24.10.0
      - name: Install locked TypeScript tooling
        run: bun install --frozen-lockfile --ignore-scripts
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.98.0
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          cache-targets: true
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Strict TypeScript and generated runtime assets
        run: |
          bun run build
          bun run check:generated
          bun run test:js
          PYTHONDONTWRITEBYTECODE=1 python3 -m unittest discover -s test -p 'test_gate.py'
      - name: Prepare explicitly pinned embedded build input
        run: bun scripts/prepare-workerd.ts --dest "$RUNNER_TEMP/open-compute-build-runtime" --download >> "$GITHUB_ENV"
      - name: fmt
        run: cargo fmt --all --check
      - name: clippy
        run: cargo clippy --workspace --all-targets --all-features -- -D warnings
      - name: no-default-features
        run: cargo check --workspace --no-default-features
      - name: metadata
        run: cargo metadata --no-deps --format-version 1
      - name: Production feature and artifact hygiene
        run: ./test/check-production.py
      - name: dependency boundaries
        run: chmod +x test/check-boundaries.sh && ./test/check-boundaries.sh

  coverage:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - uses: actions/setup-node@v4
        with:
          node-version: 24.10.0
      - name: Install locked TypeScript tooling
        run: bun install --frozen-lockfile --ignore-scripts
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.98.0
          components: llvm-tools-preview
      - uses: taiki-e/install-action@cargo-llvm-cov
      - uses: Swatinem/rust-cache@v2
        with:
          cache-targets: true
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Build untracked runtime and toolchain assets from this checkout
        run: bun run build
      - name: Prepare explicitly pinned embedded build input
        run: bun scripts/prepare-workerd.ts --dest "$RUNNER_TEMP/open-compute-build-runtime" --download >> "$GITHUB_ENV"
      - name: Enforce 90 percent Rust line coverage
        run: ./test/coverage.sh --jobs 2
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage-gate-evidence
          path: .temp/gate-run/

  integration:
    # The final runner owns the ordinary workspace pass and timing repetitions.
    # Coverage has its own instrumented pass, never final acceptance evidence.
    needs: [msrv, lint-test, coverage]
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-14]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - uses: actions/setup-node@v4
        with:
          node-version: 24.10.0
      - name: Install locked TypeScript tooling
        run: bun install --frozen-lockfile --ignore-scripts
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.98.0
      - uses: Swatinem/rust-cache@v2
      - name: Prepare explicitly pinned embedded build input
        run: bun scripts/prepare-workerd.ts --dest "$RUNNER_TEMP/open-compute-build-runtime" --download >> "$GITHUB_ENV"
      - name: Package one pinned offline executable
        run: ./scripts/package-release.sh --dest "$RUNNER_TEMP/platformd" --archive "$OPEN_COMPUTE_BUILD_WORKERD_ARCHIVE"
      - name: Final workspace once and product timing cases three times (macOS)
        if: runner.os == 'macOS'
        run: OPEN_COMPUTE_GATE_ROUNDS=3 OPEN_COMPUTE_TEST_PLATFORMD="$RUNNER_TEMP/platformd" ./test/gate.py --workspace --jobs 2
      - name: Final workspace and controlled egress (Linux, explicit privilege authorization)
        if: runner.os == 'Linux'
        run: OPEN_COMPUTE_GATE_ROUNDS=3 OPEN_COMPUTE_TEST_PLATFORMD="$RUNNER_TEMP/platformd" OPEN_COMPUTE_EGRESS_FIXTURE_ALLOW_SUDO=1 ./test/test-p0-2-egress-linux.sh --workspace --jobs 2
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: gate-evidence-${{ matrix.os }}
          path: .temp/gate-run/
