name: ci

on:
  push:
  pull_request:

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  msrv:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.98.0
      - uses: Swatinem/rust-cache@v2
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - name: Install locked build tooling
        run: bun install --frozen-lockfile --ignore-scripts
      - name: Prepare explicitly pinned embedded build input
        run: bun scripts/prepare-workerd.ts --dest "$RUNNER_TEMP/open-compute-build-runtime" --download >> "$GITHUB_ENV"
      - name: MSRV 1.98 check
        run: cargo check --workspace --all-targets

  lint-test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-14]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - uses: actions/setup-node@v4
        with:
          node-version: 24.10.0
      - name: Install locked TypeScript tooling
        run: bun install --frozen-lockfile --ignore-scripts
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.98.0
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          cache-targets: true
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Strict TypeScript and generated runtime assets
        run: |
          bun run typecheck
          bun run check:generated
          bun run test:js
          bun run --filter @open-compute/toolchain build
      - name: Prepare explicitly pinned embedded build input
        run: bun scripts/prepare-workerd.ts --dest "$RUNNER_TEMP/open-compute-build-runtime" --download >> "$GITHUB_ENV"
      - name: fmt
        run: cargo fmt --all --check
      - name: clippy
        run: cargo clippy --workspace --all-targets --all-features -- -D warnings
      - name: tests
        run: cargo test --workspace --all-targets --all-features -- --test-threads=1
      - name: no-default-features
        run: cargo check --workspace --no-default-features
      - name: metadata
        run: cargo metadata --no-deps --format-version 1
      - name: dependency boundaries
        run: chmod +x test/check-boundaries.sh && ./test/check-boundaries.sh

  coverage:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - uses: actions/setup-node@v4
        with:
          node-version: 24.10.0
      - name: Install locked TypeScript tooling
        run: bun install --frozen-lockfile --ignore-scripts
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.98.0
          components: llvm-tools-preview
      - uses: taiki-e/install-action@cargo-llvm-cov
      - uses: Swatinem/rust-cache@v2
        with:
          cache-targets: true
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Prepare explicitly pinned embedded build input
        run: bun scripts/prepare-workerd.ts --dest "$RUNNER_TEMP/open-compute-build-runtime" --download >> "$GITHUB_ENV"
      - name: Enforce 90 percent Rust line coverage
        run: ./test/coverage.sh

  integration:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-14]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - uses: actions/setup-node@v4
        with:
          node-version: 24.10.0
      - name: Install locked TypeScript tooling
        run: bun install --frozen-lockfile --ignore-scripts
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.98.0
      - uses: Swatinem/rust-cache@v2
      - name: Prepare explicitly pinned embedded build input
        run: bun scripts/prepare-workerd.ts --dest "$RUNNER_TEMP/open-compute-build-runtime" --download >> "$GITHUB_ENV"
      - name: Package one pinned offline executable
        run: ./scripts/package-release.sh --dest "$RUNNER_TEMP/platformd" --archive "$OPEN_COMPUTE_BUILD_WORKERD_ARCHIVE"
      - name: Standalone executable first-start, restart, and corruption Gate
        run: OPEN_COMPUTE_TEST_PLATFORMD="$RUNNER_TEMP/platformd" cargo test -p open-compute-service --test single_binary --all-features -- --test-threads=1
      - name: P0.1 three-round process Gate
        run: |
          ./test/test-p0-1.sh
      - name: P0.2 three-round Worker Gate (macOS)
        if: runner.os == 'macOS'
        run: |
          ./test/test-p0-2.sh
      - name: P0.2 three-round Worker and controlled egress Gate (Linux)
        if: runner.os == 'Linux'
        run: |
          OPEN_COMPUTE_EGRESS_FIXTURE_ALLOW_SUDO=1 \
            ./test/test-p0-2-egress-linux.sh
