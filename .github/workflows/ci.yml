name: ci

on:
  push:
    branches:
      - main
  pull_request:

concurrency:
  group: ci-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  msrv:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-open-compute
        with:
          rust-cache-key: default
          python: "false"
          node: "false"
      - name: Build untracked runtime and toolchain assets from this checkout
        run: bun run build
      - name: MSRV 1.98 check
        run: cargo check --workspace --all-targets

  lint-test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-open-compute
        with:
          rust-cache-key: default
          rust-components: rustfmt, clippy
      - name: Strict TypeScript and generated runtime assets
        run: |
          bun run build
          bun run check:generated
          bun run test:js:ci
          PYTHONDONTWRITEBYTECODE=1 python3 -m unittest discover -s test -p 'test_gate.py'
      - name: fmt
        run: cargo fmt --all --check
      - name: clippy
        run: cargo clippy --workspace --all-targets --all-features --keep-going -- -D warnings
      - name: no-default-features
        run: cargo check --workspace --no-default-features
      - name: metadata
        run: cargo metadata --no-deps --format-version 1
      - name: Production feature and artifact hygiene
        run: ./test/check-production.py
      - name: dependency boundaries
        run: chmod +x test/check-boundaries.sh && ./test/check-boundaries.sh

  integration:
    # Push/PR: one Ubuntu workspace round. Cross-platform qualification,
    # coverage, and release packaging belong to the tag workflow.
    needs: [msrv, lint-test]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-open-compute
        with:
          rust-cache-key: default
      - name: Build untracked runtime and toolchain assets from this checkout
        run: bun run build
      - name: Fetch locked crates for offline Gate compile
        run: cargo fetch --locked
      - name: Final workspace once (Linux, explicit privilege authorization)
        run: OPEN_COMPUTE_GATE_ROUNDS=1 OPEN_COMPUTE_EGRESS_FIXTURE_ALLOW_SUDO=1 ./test/test-p0-2-egress-linux.sh --workspace --jobs 2
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: gate-evidence-ubuntu-24.04
          path: .temp/gate-run/

  ci:
    if: ${{ always() && !cancelled() }}
    needs: [msrv, lint-test, integration]
    runs-on: ubuntu-24.04
    steps:
      - name: Require every upstream job
        run: |
          test "${{ needs.msrv.result }}" = success
          test "${{ needs.lint-test.result }}" = success
          test "${{ needs.integration.result }}" = success
