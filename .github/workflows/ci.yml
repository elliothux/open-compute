name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  failfast:
    runs-on: ubuntu-24.04
    outputs:
      scope: ${{ steps.scope.outputs.scope }}
      components: ${{ steps.scope.outputs.components }}
      gate_targets: ${{ steps.scope.outputs.gate_targets }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - name: Classify changed files
        id: scope
        env:
          BASE_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          PYTHONDONTWRITEBYTECODE=1 python3 -m unittest discover -s test -p 'test_ci_scope.py'
          PYTHONDONTWRITEBYTECODE=1 python3 test/ci_scope.py \
            --base "$BASE_SHA" --head "$HEAD_SHA" >> "$GITHUB_OUTPUT"
      - name: Validate source identity and stress contracts
        run: |
          bun test/conformance/check.ts --case baseline-identity
          node --test test/stress.test.mjs

  fixture-images:
    needs: failfast
    if: needs.failfast.outputs.scope == 'full' || needs.failfast.outputs.gate_targets != '' || (github.ref == 'refs/heads/main' && (github.event_name == 'workflow_dispatch' || github.event_name == 'push'))
    uses: ./.github/workflows/container-images.yml
    with:
      arm64: false

  checks:
    # Fast development checks. Full acceptance is owned by the release workflow.
    needs: [failfast, fixture-images]
    if: needs.failfast.outputs.scope == 'full'
    strategy:
      fail-fast: false
      matrix:
        include:
          - suite: core
            rust_components: rustfmt
          - suite: clippy
            rust_components: clippy
          - suite: production
            rust_components: ""
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          lfs: true
      - uses: ./.github/actions/setup-open-compute
        with:
          rust-components: ${{ matrix.rust_components }}
      - uses: ./.github/actions/prepare-container-fixture-images
      - name: Build and typecheck current runtime and tooling assets
        run: bun run build
      - name: Fast JavaScript and Gate tooling tests
        if: matrix.suite == 'core'
        run: |
          bun run test:js:ci
          PYTHONDONTWRITEBYTECODE=1 python3 -m unittest discover -s test -p 'test_gate.py'
          PYTHONDONTWRITEBYTECODE=1 python3 -m unittest discover -s test/containers-fixture -p 'test_*.py'
      - name: Service installation permissions and umask regression
        if: matrix.suite == 'core'
        run: mbx test --locked -p open-compute-service --lib service_manager::tests -- --test-threads=1
      - name: fmt
        if: matrix.suite == 'core'
        run: mbx fmt --all --check
      - name: clippy
        if: matrix.suite == 'clippy'
        run: ./test/check-rust-clippy.sh
      - name: no-default-features
        if: matrix.suite == 'core'
        run: mbx check --workspace --no-default-features
      - name: Rust 1.98 workspace and target compile check
        if: matrix.suite == 'core'
        run: mbx +1.98.0 check --workspace --all-targets
      - name: metadata
        if: matrix.suite == 'core'
        run: mbx metadata --no-deps --format-version 1
      - name: Fetch locked crates for offline production checks
        if: matrix.suite == 'production'
        run: mbx fetch --locked
      - name: Production feature and artifact hygiene
        if: matrix.suite == 'production'
        run: ./test/check-production.py
      - name: dependency boundaries
        if: matrix.suite == 'core'
        run: ./test/check-boundaries.sh

  product-gates:
    needs: [failfast, fixture-images]
    if: needs.failfast.outputs.gate_targets != ''
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          lfs: true
      - uses: ./.github/actions/setup-open-compute
        with:
          browser-fixture: ${{ contains(needs.failfast.outputs.gate_targets, 'p22-browser-run') && 'true' || 'false' }}
      - uses: ./.github/actions/prepare-container-fixture-images
        id: container-images
      - name: Build runtime and application assets
        run: bun run build
      - name: Run affected product Gates
        env:
          GATE_TARGETS: ${{ needs.failfast.outputs.gate_targets }}
        run: |
          set -euo pipefail
          read -r -a targets <<< "$GATE_TARGETS"
          command=(./test/gate.py)
          if [[ " $GATE_TARGETS " == *" p0-2 "* ]]; then
            command=(env OPEN_COMPUTE_EGRESS_FIXTURE_ALLOW_SUDO=1 ./test/test-p0-2-egress-linux.sh)
          fi
          if [[ " $GATE_TARGETS " == *" p23-containers "* ]]; then
            mbx build --locked -p open-compute-service --bin ocd --features test-support
            bash test/containers-fixture/with-ci-linux-engine.sh \
              --images '${{ steps.container-images.outputs.directory }}' \
              --binary "$PWD/target/debug/ocd" \
              --root /tmp/oc-ci-products \
              --evidence "$PWD/.temp/containers-ci-engine" \
              --command "${command[@]}" "${targets[@]}" --keep-going --jobs 2
          else
            "${command[@]}" "${targets[@]}" --keep-going --jobs 2
          fi
      - name: Release the CI browser AppArmor profile
        if: always()
        run: |
          if [[ -n "${OPEN_COMPUTE_CI_BROWSER_APPARMOR_EXECUTABLE:-}" ]]; then
            python3 scripts/ci-browser-apparmor.py remove \
              "$OPEN_COMPUTE_CI_BROWSER_APPARMOR_EXECUTABLE"
          fi
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: affected-product-gate-failures
          include-hidden-files: true
          path: .temp/gate-run/failed/

  frontend-checks:
    needs: failfast
    if: needs.failfast.outputs.scope == 'frontend'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - uses: actions/setup-node@v7
        with:
          node-version: 26.8.1
      - uses: actions/cache@v6
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-${{ hashFiles('bun.lock') }}
          restore-keys: ${{ runner.os }}-bun-
      - name: Install locked JavaScript dependencies
        run: bun install --frozen-lockfile --ignore-scripts
      - name: Check changed frontend packages
        env:
          COMPONENTS: ${{ needs.failfast.outputs.components }}
        run: |
          set -euo pipefail
          case ",$COMPONENTS," in
            *,sdk,*|*,dashboard,*) bun run --filter @open-compute/sdk build ;;
          esac
          case ",$COMPONENTS," in
            *,sdk,*)
              bun run --filter @open-compute/sdk typecheck
              bun run --filter @open-compute/sdk test
              ;;
          esac
          case ",$COMPONENTS," in
            *,dashboard,*)
              bun run --filter @open-compute/dashboard format:check
              bun run --filter @open-compute/dashboard lint
              bun run --filter @open-compute/dashboard test
              bun run --filter @open-compute/dashboard build
              ;;
          esac
          case ",$COMPONENTS," in
            *,website,*) bun run --filter @open-compute/website build ;;
          esac
          case ",$COMPONENTS," in
            *,docs,*) bun scripts/check-docs.ts ;;
          esac

  docs-checks:
    needs: failfast
    if: needs.failfast.outputs.scope == 'docs'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - name: Check documentation links and mirrors
        run: bun scripts/check-docs.ts

  release-tooling-checks:
    needs: failfast
    if: needs.failfast.outputs.scope == 'release-tooling'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - uses: actions/cache@v6
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-${{ hashFiles('bun.lock') }}
          restore-keys: ${{ runner.os }}-bun-
      - name: Install locked JavaScript dependencies
        run: bun install --frozen-lockfile --ignore-scripts
      - name: Check release tooling and documentation
        run: |
          node_modules/.bin/tsc --project scripts/tsconfig.json --noEmit
          node_modules/.bin/prettier --check --ignore-unknown \
            .github/workflows/release*.yml \
            docs/references/releasing.md \
            docs/references/ci-build-performance.md \
            scripts/assemble-release.ts \
            test/release-tools.test.mjs
          bun scripts/check-docs.ts

  ci:
    if: ${{ always() && !cancelled() }}
    needs:
      [
        failfast,
        fixture-images,
        checks,
        product-gates,
        frontend-checks,
        docs-checks,
        release-tooling-checks,
      ]
    runs-on: ubuntu-24.04
    steps:
      - name: Require development checks
        env:
          SCOPE: ${{ needs.failfast.outputs.scope }}
          GATE_TARGETS: ${{ needs.failfast.outputs.gate_targets }}
        run: |
          set -euo pipefail
          test "${{ needs.failfast.result }}" = success
          if [ "${{ github.event_name }}" != pull_request ]; then
            test "${{ needs.fixture-images.result }}" = success
          fi
          if [ -n "$GATE_TARGETS" ]; then
            test "${{ needs.product-gates.result }}" = success
          fi
          case "$SCOPE" in
            full)
              test "${{ needs.fixture-images.result }}" = success
              test "${{ needs.checks.result }}" = success
              ;;
            frontend) test "${{ needs.frontend-checks.result }}" = success ;;
            docs) test "${{ needs.docs-checks.result }}" = success ;;
            release-tooling) test "${{ needs.release-tooling-checks.result }}" = success ;;
            *) echo "unknown CI scope: $SCOPE" >&2; exit 1 ;;
          esac
