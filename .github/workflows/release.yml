name: release

on:
  push:
    tags:
      - "v*"

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read
  actions: read

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  failfast:
    runs-on: ubuntu-24.04
    environment: release
    outputs:
      tag: ${{ steps.release.outputs.tag }}
      version: ${{ steps.release.outputs.version }}
      notes: ${{ steps.release.outputs.notes }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          fetch-tags: true
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
      - name: Validate immutable stable release identity
        id: release
        shell: bash
        run: |
          set -euo pipefail
          tag="$GITHUB_REF_NAME"
          if [[ ! "$tag" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]; then
            echo "release tags must be stable SemVer in the form vX.Y.Z" >&2
            exit 1
          fi
          if [ "$(git cat-file -t "$tag")" != tag ]; then
            echo "release tags must be annotated tags" >&2
            exit 1
          fi
          if [ "$(git rev-parse "$tag^{}")" != "$GITHUB_SHA" ] || [ "$(git rev-parse HEAD)" != "$GITHUB_SHA" ]; then
            echo "the checked-out revision does not match the release tag" >&2
            exit 1
          fi
          git fetch --no-tags origin release:refs/remotes/origin/release
          release_head="$(git rev-parse refs/remotes/origin/release)"
          if [ "$GITHUB_SHA" != "$release_head" ]; then
            echo "the release tag must point to the current origin/release HEAD" >&2
            exit 1
          fi
          version="$(awk '
            $0 == "[workspace.package]" { section = 1; next }
            section && /^\[/ { exit }
            section && /^version = "/ {
              value = $0
              sub(/^version = "/, "", value)
              sub(/"$/, "", value)
              print value
              found = 1
            }
            END { if (!found) exit 1 }
          ' Cargo.toml)"
          if [ "$tag" != "v$version" ]; then
            echo "tag $tag does not match workspace version $version" >&2
            exit 1
          fi
          sdk_version="$(node -p "require('./packages/sdk/package.json').version")"
          if [ "$sdk_version" != "$version" ]; then
            echo "packages/sdk version $sdk_version does not match workspace version $version" >&2
            exit 1
          fi
          notes="docs/releases/$version.md"
          if [ ! -f "$notes" ] || [ -L "$notes" ]; then
            echo "release notes must be a checked-in regular file at $notes" >&2
            exit 1
          fi
          if [ "$(wc -c < "$notes" | tr -d ' ')" -lt 1000 ]; then
            echo "release notes must contain at least 1000 bytes of substantive content" >&2
            exit 1
          fi
          if grep -Eq '^#[[:space:]]' "$notes"; then
            echo "release notes are a GitHub Release body and must not contain a level-one heading" >&2
            exit 1
          fi
          for heading in \
            "## What's new" \
            "## Workerd" \
            "## SDK" \
            "## Fixed" \
            "## Before you upgrade" \
            "## Install or upgrade" \
            "## Downloads" \
            "## Security" \
            "## Known limitations" \
            "## Verification" \
            "## Thanks"; do
            if ! grep -Fqx "$heading" "$notes"; then
              echo "release notes are missing required heading: $heading" >&2
              exit 1
            fi
          done
          if grep -Eiq '(^|[^A-Za-z])(TODO|TBD|PLACEHOLDER)([^A-Za-z]|$)' "$notes"; then
            echo "release notes contain an unfinished placeholder" >&2
            exit 1
          fi
          test -z "$(git status --porcelain --untracked-files=all)"
          {
            echo "tag=$tag"
            echo "version=$version"
            echo "notes=$notes"
          } >> "$GITHUB_OUTPUT"

      - name: Validate source identity and release-tool contracts
        run: |
          bun test/conformance/check.ts --case baseline-identity
          node --test test/release-tools.test.mjs

      - name: Validate release environment and npm destination
        env:
          NPM_ACCESS_TOKEN: ${{ secrets.NPM_ACCESS_TOKEN }}
          RELEASE_VERSION: ${{ steps.release.outputs.version }}
        run: |
          set -euo pipefail
          test -n "$NPM_ACCESS_TOKEN"
          printf '//registry.npmjs.org/:_authToken=${NPM_ACCESS_TOKEN}\n' > "$RUNNER_TEMP/.npmrc"
          export NPM_CONFIG_USERCONFIG="$RUNNER_TEMP/.npmrc"
          npm whoami --registry https://registry.npmjs.org
          if npm view "@open-compute/sdk@$RELEASE_VERSION" version \
            --registry https://registry.npmjs.org >"$RUNNER_TEMP/npm-version" 2>"$RUNNER_TEMP/npm-version-error"; then
            echo "@open-compute/sdk@$RELEASE_VERSION is already published; use release-recovery for a partial release" >&2
            exit 1
          fi
          if ! grep -F 'E404' "$RUNNER_TEMP/npm-version-error" >/dev/null; then
            cat "$RUNNER_TEMP/npm-version-error" >&2
            exit 1
          fi

      - name: Require workerd submodule notes and thanks to external reporters
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          notes="docs/releases/${GITHUB_REF_NAME#v}.md"
          section() {
            awk -v heading="$1" '
              $0 == heading { capture = 1; next }
              capture && /^## / { exit }
              capture { print }
            ' "$notes"
          }
          prev="$(git describe --tags --abbrev=0 --match 'v*' "${GITHUB_SHA}^")"
          old="$(git rev-parse "${prev}:third_party/workerd")"
          new="$(git rev-parse "HEAD:third_party/workerd")"
          workerd="$(section '## Workerd')"
          if [ "$old" != "$new" ]; then
            printf '%s\n' "$workerd" | grep -F "$old" >/dev/null \
              || { echo "Workerd notes must name the previous submodule revision $old" >&2; exit 1; }
            printf '%s\n' "$workerd" | grep -F "$new" >/dev/null \
              || { echo "Workerd notes must name the new submodule revision $new" >&2; exit 1; }
            printf '%s\n' "$workerd" | grep -F 'third_party/workerd' >/dev/null \
              || { echo "Workerd notes must name the third_party/workerd submodule" >&2; exit 1; }
          else
            printf '%s\n' "$workerd" | grep -F 'submodule revision is unchanged' >/dev/null \
              || { echo "Workerd notes must say the submodule revision is unchanged" >&2; exit 1; }
          fi
          since="$(date -u -d "$(git log -1 --format=%cI "$prev")" +%Y-%m-%dT%H:%M:%SZ)"
          owner="$(gh repo view --json owner --jq .owner.login)"
          authors="$(gh issue list --repo "$GITHUB_REPOSITORY" --state closed --limit 200 \
            --search "closed:>=${since%%T*} is:issue" \
            --json number,author,closedAt,stateReason \
            | jq -r --arg since "$since" --arg owner "$owner" '
              map(select(
                (.stateReason | ascii_downcase) == "completed"
                and .closedAt > $since
                and .author.is_bot != true
                and .author.login != $owner
              ))
              | .[].author.login
            ' | sort -u)"
          thanks="$(section '## Thanks')"
          if [ -z "$authors" ]; then
            printf '%s\n' "$thanks" | grep -Fx 'No external issue reports were closed in this release.' >/dev/null \
              || { echo "Thanks must use the exact no-external-reports sentence" >&2; exit 1; }
          else
            while IFS= read -r login; do
              printf '%s\n' "$thanks" | grep -F "$login" >/dev/null \
                || { echo "Thanks must name and thank @$login" >&2; exit 1; }
            done <<< "$authors"
            printf '%s\n' "$thanks" | grep -Eq '^[Tt]hanks( to)? ' \
              || { echo "Thanks must explicitly thank the named reporters" >&2; exit 1; }
          fi

      - name: Require successful main pre-check for the release source commit
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # A protected release PR is merged with a merge commit. Its second
          # parent is the already checked main source commit. If a repository
          # uses a fast-forward-compatible merge, the release commit itself is
          # the source commit and is checked directly.
          source_sha="$GITHUB_SHA"
          parents=( $(git rev-list --parents -n 1 "$GITHUB_SHA") )
          if [ "${#parents[@]}" -eq 3 ]; then
            source_sha="${parents[2]}"
          fi
          count="$(gh run list --repo "$GITHUB_REPOSITORY" --workflow ci.yml \
            --branch main --event push --commit "$source_sha" --status success \
            --json databaseId --jq 'length')"
          test "$count" -gt 0

  coverage:
    needs: failfast
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v7
        with:
          lfs: true
      - uses: ./.github/actions/setup-open-compute
        with:
          rust-cache-key: llvm-cov-${{ hashFiles('crates/storage/refinery-migrations/**/*.sql') }}
          rust-workspaces: ". -> target/llvm-cov-target"
          llvm-cov: "true"
          rust-components: llvm-tools-preview
      - name: Build untracked runtime and toolchain assets from this checkout
        run: bun run build
      - name: Enforce 90 percent Rust line coverage
        run: ./test/coverage.sh --jobs 2
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: coverage-gate-evidence
          include-hidden-files: true
          path: |
            .temp/gate-run/
            .temp/**/failed/**/ocd.log
            target/llvm-cov/summary.json
            target/llvm-cov/lcov.info

  integration:
    needs: failfast
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
        with:
          lfs: true
      - uses: ./.github/actions/setup-open-compute
        with:
          rust-cache-key: default-${{ hashFiles('crates/storage/refinery-migrations/**/*.sql') }}
      - name: Build untracked runtime and toolchain assets from this checkout
        run: bun run build
      - name: Fetch locked crates for offline Gate compile
        run: cargo fetch --locked
      - name: Final workspace once (macOS)
        if: runner.os == 'macOS'
        run: ./test/gate.py --workspace --jobs 2
      - name: Controlled P0.2 egress only (Linux, explicit privilege authorization)
        if: runner.os == 'Linux'
        run: OPEN_COMPUTE_EGRESS_FIXTURE_ALLOW_SUDO=1 ./test/test-p0-2-egress-linux.sh p0-2 --jobs 2
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: gate-evidence-${{ matrix.os }}
          include-hidden-files: true
          path: |
            .temp/gate-run/
            .temp/**/failed/**/ocd.log

  package:
    # Build in parallel with qualification; publication still requires every Gate.
    needs: failfast
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: darwin-arm64
            os: macos-15
          - target: linux-arm64
            os: ubuntu-24.04-arm
          - target: linux-x64
            os: ubuntu-24.04
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
        with:
          lfs: true
      - uses: ./.github/actions/setup-open-compute
        with:
          # Reuse main's debug/test target for the single-binary harness.
          rust-cache-key: default-${{ hashFiles('crates/storage/refinery-migrations/**/*.sql') }}
          rust-cache-save: "false"
      - name: Cache release dependency artifacts
        uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: false
          save-if: "true"
          add-job-id-key: false
          shared-key: v3-release-${{ matrix.target }}-${{ hashFiles('crates/storage/refinery-migrations/**/*.sql') }}
          workspaces: ". -> .temp/release-target"
          cache-all-crates: false
      - uses: mozilla-actions/sccache-action@v0.0.11
        with:
          version: v0.16.0
      - name: Restore bounded compiler cache
        id: compiler-cache
        uses: actions/cache/restore@v6
        with:
          path: .temp/sccache
          key: compiler-v2-${{ runner.os }}-${{ runner.arch }}-rust1.98-sccache0.16-${{ hashFiles('Cargo.lock', 'Cargo.toml', 'packages/runtime/workerd.lock.json', 'crates/storage/refinery-migrations/**/*.sql') }}
          restore-keys: |
            compiler-v2-${{ runner.os }}-${{ runner.arch }}-rust1.98-sccache0.16-
      - name: Enable local compiler cache without per-crate remote cache requests
        shell: bash
        run: |
          echo "RUSTC_WRAPPER=sccache" >> "$GITHUB_ENV"
          echo "SCCACHE_DIR=$GITHUB_WORKSPACE/.temp/sccache" >> "$GITHUB_ENV"
          echo "SCCACHE_CACHE_SIZE=512M" >> "$GITHUB_ENV"
      - name: Fetch locked crates for offline packaged-binary tests
        run: cargo fetch --locked
      - name: Package and verify the native single executable
        shell: bash
        env:
          RELEASE_TAG: ${{ needs.failfast.outputs.tag }}
          RELEASE_TARGET: ${{ matrix.target }}
        run: |
          set -euo pipefail
          destination="$RUNNER_TEMP/ocd-$RELEASE_TAG-$RELEASE_TARGET"
          report="$RUNNER_TEMP/release-report-$RELEASE_TARGET.json"
          export CARGO_TARGET_DIR="$GITHUB_WORKSPACE/.temp/release-target"
          ./scripts/package-release.sh \
            --dest "$destination" \
            --archive "$OPEN_COMPUTE_BUILD_WORKERD_ARCHIVE" | tee "$report"
          REPORT="$report" bun -e '
            const report = await Bun.file(process.env.REPORT).json();
            if (report.schemaVersion !== 1 || report.target !== process.env.RELEASE_TARGET
                || report.version !== process.env.RELEASE_TAG.slice(1)
                || report.revision !== process.env.GITHUB_SHA) {
                throw new Error("packaged release identity does not match the matrix");
              }
            '
          unset CARGO_TARGET_DIR RUSTC_WRAPPER SCCACHE_DIR SCCACHE_CACHE_SIZE
          OPEN_COMPUTE_TEST_OCD="$destination" \
            ./test/gate.py single-binary --jobs 1
      - name: Exercise the packaged Dashboard against the candidate executable
        if: matrix.target == 'linux-arm64'
        shell: bash
        env:
          RELEASE_TAG: ${{ needs.failfast.outputs.tag }}
          OPEN_COMPUTE_ADMIN_TOKEN: dev-admin-token
          OPEN_COMPUTE_DEPLOYER_TOKEN: dev-deployer-token
          OPEN_COMPUTE_READ_ONLY_TOKEN: dev-read-only-token
          OPEN_COMPUTE_DASHBOARD_E2E_BASE_URL: http://127.0.0.1:18787/operator/
          # Google Chrome channel is not supported on Linux Arm64; use Playwright's
          # bundled Chromium (default when OPEN_COMPUTE_DASHBOARD_E2E_BROWSER_CHANNEL
          # is unset — see apps/dashboard/playwright.config.ts).
        run: |
          set -euo pipefail
          evidence="$GITHUB_WORKSPACE/.temp/dashboard-e2e"
          mkdir -p "$evidence"
          candidate="$RUNNER_TEMP/ocd-$RELEASE_TAG-linux-arm64"
          OPEN_COMPUTE_OCD_BIN="$candidate" \
            ./scripts/dev-test.sh run >"$evidence/ocd.log" 2>&1 &
          server_pid=$!
          cleanup() {
            kill "$server_pid" 2>/dev/null || true
            wait "$server_pid" 2>/dev/null || true
          }
          trap cleanup EXIT
          # Playwright's chrome channel is unavailable on Linux Arm64
          # ("ERROR: not supported on Linux Arm64"). Install bundled Chromium.
          apps/dashboard/node_modules/.bin/playwright install --with-deps chromium
          bun run test:dashboard:e2e
      - uses: actions/upload-artifact@v7
        with:
          name: release-${{ matrix.target }}
          path: |
            ${{ runner.temp }}/ocd-${{ needs.failfast.outputs.tag }}-${{ matrix.target }}
            ${{ runner.temp }}/release-report-${{ matrix.target }}.json
          if-no-files-found: error
          retention-days: 14
          compression-level: 0
      - name: Compiler cache statistics
        if: always()
        run: sccache --show-stats
      - name: Save compiler cache including failed builds
        if: ${{ always() && !cancelled() && steps.compiler-cache.outputs.cache-hit != 'true' }}
        continue-on-error: true
        uses: actions/cache/save@v6
        with:
          path: .temp/sccache
          key: ${{ steps.compiler-cache.outputs.cache-primary-key }}
      - name: Retain compiler timings
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: build-timings-${{ matrix.target }}
          path: .temp/release-target/cargo-timings/
          if-no-files-found: ignore
      - name: Retain failed native builds for diagnosis and subsequent verification
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: unverified-native-build-${{ matrix.target }}
          path: |
            target/*/release/ocd
            ${{ runner.temp }}/release-report-${{ matrix.target }}.json
          if-no-files-found: ignore
          compression-level: 0
          retention-days: 14
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: package-gate-${{ matrix.target }}
          include-hidden-files: true
          path: |
            .temp/gate-run/
            .temp/dashboard-e2e/
            .temp/**/failed/**/ocd.log
            apps/dashboard/test-results/

  sdk-package:
    # Build the SDK tarball once from a clean checkout while qualification
    # runs; publication still requires every Gate to pass first.
    needs: failfast
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
      - name: Verify the npm CLI meets the supported minimum
        run: |
          set -euo pipefail
          npm_major_minor="$(npm --version | cut -d. -f1-2)"
          node -e 'const [major, minor] = process.argv[1].split(".").map(Number);
            if (major < 11 || (major === 11 && minor < 5)) throw new Error("npm >= 11.5.1 is required");' "$npm_major_minor"
      - name: Install locked dependencies without lifecycle scripts
        run: bun install --frozen-lockfile --ignore-scripts
      - name: Regenerate, typecheck, and test the SDK package
        run: |
          bun run --filter @open-compute/sdk typecheck
          bun run --filter @open-compute/sdk test
      - name: Build the dual-module package
        run: bun run --filter @open-compute/sdk build
      - name: Pack, inspect, and smoke the package tarball
        run: bun packages/sdk/scripts/inspect-package.ts > "$RUNNER_TEMP/sdk-inspect.log" 2>&1 || { cat "$RUNNER_TEMP/sdk-inspect.log"; exit 1; }
      - uses: actions/upload-artifact@v7
        with:
          name: sdk-package
          path: |
            .temp/sdk-package/*.tgz
            .temp/sdk-package/sdk-package-report.json
          if-no-files-found: error
          retention-days: 14
          compression-level: 0

  assemble:
    needs: [failfast, package, sdk-package]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - uses: actions/download-artifact@v8
        with:
          pattern: release-*
          path: .temp/release-assets
          merge-multiple: true
      - uses: actions/download-artifact@v8
        with:
          name: sdk-package
          path: .temp/sdk-package
      - name: Assemble the immutable release manifest
        env:
          RELEASE_TAG: ${{ needs.failfast.outputs.tag }}
        run: |
          set -euo pipefail
          bun scripts/assemble-release.ts \
            --tag "$RELEASE_TAG" \
            --dir "$GITHUB_WORKSPACE/.temp/release-assets" \
            --sdk-report "$GITHUB_WORKSPACE/.temp/sdk-package/sdk-package-report.json"
          # The SDK tarball is distributed by npm, never as a sixth GitHub asset.
          if ls .temp/release-assets/*.tgz >/dev/null 2>&1; then
            echo "the GitHub release must not carry the SDK tarball" >&2
            exit 1
          fi
      - uses: actions/upload-artifact@v7
        with:
          name: public-release
          path: |
            .temp/release-assets/ocd-*
            .temp/release-assets/release.json
            .temp/release-assets/SHA256SUMS
          if-no-files-found: error
          retention-days: 14
          compression-level: 0

  publish:
    needs: [failfast, assemble, coverage, integration, sdk-package]
    runs-on: ubuntu-24.04
    environment: release
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
      - uses: actions/download-artifact@v8
        with:
          name: public-release
          path: .temp/release-assets
      - uses: actions/download-artifact@v8
        with:
          name: sdk-package
          path: .temp/sdk-package
      - name: Create a draft and verify uploaded bytes
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.failfast.outputs.tag }}
          RELEASE_VERSION: ${{ needs.failfast.outputs.version }}
          RELEASE_NOTES: ${{ needs.failfast.outputs.notes }}
        run: |
          set -euo pipefail
          assets="$GITHUB_WORKSPACE/.temp/release-assets"
          mapfile -t files < <(find "$assets" -maxdepth 1 -type f \
            \( -name "ocd-$RELEASE_TAG-*" -o -name SHA256SUMS -o -name release.json \) \
            -print | sort)
          if [ "${#files[@]}" -ne 5 ]; then
            echo "expected three executables, SHA256SUMS, and release.json" >&2
            exit 1
          fi
          if gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            test "$(gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --json isDraft --jq .isDraft)" = true
          else
            gh release create "$RELEASE_TAG" "${files[@]}" \
              --repo "$GITHUB_REPOSITORY" \
              --verify-tag \
              --draft \
              --notes-file "$GITHUB_WORKSPACE/$RELEASE_NOTES" \
              --title "open-compute $RELEASE_VERSION"
          fi
          verify="$RUNNER_TEMP/release-download"
          mkdir "$verify"
          gh release download "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --dir "$verify"
          if [ "$(find "$verify" -maxdepth 1 -type f | wc -l | tr -d ' ')" -ne 5 ]; then
            echo "the draft release does not contain the exact asset set" >&2
            exit 1
          fi
          for source in "${files[@]}"; do
            cmp "$source" "$verify/$(basename "$source")"
          done
          (cd "$verify" && sha256sum --check SHA256SUMS)
      - name: Publish the verified SDK tarball to npm
        shell: bash
        env:
          NPM_ACCESS_TOKEN: ${{ secrets.NPM_ACCESS_TOKEN }}
          RELEASE_VERSION: ${{ needs.failfast.outputs.version }}
        run: |
          set -euo pipefail
          report=".temp/sdk-package/sdk-package-report.json"
          tarball="$(node -p "require('$GITHUB_WORKSPACE/.temp/sdk-package/sdk-package-report.json').tarball")"
          tarball=".temp/sdk-package/$tarball"
          expected_shasum="$(node -p "require('$GITHUB_WORKSPACE/.temp/sdk-package/sdk-package-report.json').tarballShasum")"
          expected_integrity="$(node -p "require('$GITHUB_WORKSPACE/.temp/sdk-package/sdk-package-report.json').tarballIntegrity")"
          printf '//registry.npmjs.org/:_authToken=${NPM_ACCESS_TOKEN}\n' > "$RUNNER_TEMP/.npmrc"
          export NPM_CONFIG_USERCONFIG="$RUNNER_TEMP/.npmrc"
          if ! npm publish "$tarball" --access public --registry https://registry.npmjs.org; then
            read_shasum="$(npm view "@open-compute/sdk@$RELEASE_VERSION" dist.shasum --registry https://registry.npmjs.org 2>/dev/null || true)"
            read_integrity="$(npm view "@open-compute/sdk@$RELEASE_VERSION" dist.integrity --registry https://registry.npmjs.org 2>/dev/null || true)"
            if [ "$read_shasum" != "$expected_shasum" ] || [ "$read_integrity" != "$expected_integrity" ]; then
              echo "npm publish failed and no identical published package was readable" >&2
              exit 1
            fi
          fi
      - name: Publish the verified draft release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.failfast.outputs.tag }}
        run: |
          gh release edit "$RELEASE_TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --draft=false \
            --latest
