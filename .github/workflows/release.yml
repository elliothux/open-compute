name: release

on:
  push:
    tags:
      - "v*"

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read
  actions: read

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  validate:
    runs-on: ubuntu-24.04
    outputs:
      tag: ${{ steps.release.outputs.tag }}
      version: ${{ steps.release.outputs.version }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          fetch-tags: true
      - name: Validate immutable stable release identity
        id: release
        shell: bash
        run: |
          set -euo pipefail
          tag="$GITHUB_REF_NAME"
          if [[ ! "$tag" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]; then
            echo "release tags must be stable SemVer in the form vX.Y.Z" >&2
            exit 1
          fi
          if [ "$(git cat-file -t "$tag")" != tag ]; then
            echo "release tags must be annotated tags" >&2
            exit 1
          fi
          if [ "$(git rev-parse "$tag^{}")" != "$GITHUB_SHA" ] || [ "$(git rev-parse HEAD)" != "$GITHUB_SHA" ]; then
            echo "the checked-out revision does not match the release tag" >&2
            exit 1
          fi
          git fetch --no-tags origin release:refs/remotes/origin/release
          if ! git merge-base --is-ancestor "$GITHUB_SHA" refs/remotes/origin/release; then
            echo "the release revision must already be reachable from origin/release" >&2
            exit 1
          fi
          version="$(awk '
            $0 == "[workspace.package]" { section = 1; next }
            section && /^\[/ { exit }
            section && /^version = "/ {
              value = $0
              sub(/^version = "/, "", value)
              sub(/"$/, "", value)
              print value
              found = 1
            }
            END { if (!found) exit 1 }
          ' Cargo.toml)"
          if [ "$tag" != "v$version" ]; then
            echo "tag $tag does not match workspace version $version" >&2
            exit 1
          fi
          test -z "$(git status --porcelain --untracked-files=all)"
          {
            echo "tag=$tag"
            echo "version=$version"
          } >> "$GITHUB_OUTPUT"

      - name: Require successful release-branch CI for the exact release commit
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          count="$(gh run list --repo "$GITHUB_REPOSITORY" --workflow ci.yml \
            --branch release --event push --commit "$GITHUB_SHA" --status success \
            --json databaseId --jq 'length')"
          test "$count" -gt 0

  msrv:
    needs: validate
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-open-compute
        with:
          rust-cache-key: default
          rust-cache-save: "false"
          python: "false"
          node: "false"
      - name: Build untracked runtime and toolchain assets from this checkout
        run: bun run build
      - name: MSRV 1.98 check
        run: cargo check --workspace --all-targets

  lint-test:
    needs: validate
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-open-compute
        with:
          rust-cache-key: default
          rust-components: rustfmt, clippy
      - name: Strict TypeScript and generated runtime assets
        run: |
          bun run build
          bun run check:generated
          bun run test:js:ci
          PYTHONDONTWRITEBYTECODE=1 python3 -m unittest discover -s test -p 'test_gate.py'
      - name: fmt
        run: cargo fmt --all --check
      - name: clippy
        run: cargo clippy --workspace --all-targets --all-features --keep-going -- -D warnings
      - name: no-default-features
        run: cargo check --workspace --no-default-features
      - name: metadata
        run: cargo metadata --no-deps --format-version 1
      - name: Production feature and artifact hygiene
        run: ./test/check-production.py
      - name: dependency boundaries
        run: chmod +x test/check-boundaries.sh && ./test/check-boundaries.sh

  coverage:
    needs: [validate, msrv, lint-test]
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-open-compute
        with:
          rust-cache-key: llvm-cov
          rust-workspaces: ". -> target/llvm-cov-target"
          llvm-cov: "true"
          rust-components: llvm-tools-preview
      - name: Build untracked runtime and toolchain assets from this checkout
        run: bun run build
      - name: Enforce 90 percent Rust line coverage
        run: ./test/coverage.sh --jobs 2
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: coverage-gate-evidence
          include-hidden-files: true
          path: |
            .temp/gate-run/
            .temp/**/failed/**/ocd.log
            target/llvm-cov/summary.json
            target/llvm-cov/lcov.info

  integration:
    needs: [validate, msrv, lint-test, coverage]
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-open-compute
        with:
          rust-cache-key: default
      - name: Build untracked runtime and toolchain assets from this checkout
        run: bun run build
      - name: Fetch locked crates for offline Gate compile
        run: cargo fetch --locked
      - name: Final workspace once (macOS)
        if: runner.os == 'macOS'
        run: ./test/gate.py --workspace --jobs 2
      - name: Final workspace and controlled egress (Linux, explicit privilege authorization)
        if: runner.os == 'Linux'
        run: OPEN_COMPUTE_EGRESS_FIXTURE_ALLOW_SUDO=1 ./test/test-p0-2-egress-linux.sh --workspace --jobs 2
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: gate-evidence-${{ matrix.os }}
          include-hidden-files: true
          path: |
            .temp/gate-run/
            .temp/**/failed/**/ocd.log

  package:
    # Build in parallel with qualification; publication still requires every Gate.
    needs: validate
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: darwin-arm64
            os: macos-15
          - target: darwin-x64
            os: macos-15-intel
          - target: linux-arm64
            os: ubuntu-24.04-arm
          - target: linux-x64
            os: ubuntu-24.04
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-open-compute
        with:
          rust-cache-key: release-${{ matrix.target }}
      - uses: mozilla-actions/sccache-action@v0.0.11
        with:
          version: v0.16.0
      - name: Restore bounded compiler cache
        id: compiler-cache
        uses: actions/cache/restore@v6
        with:
          path: .temp/sccache
          key: compiler-${{ runner.os }}-${{ runner.arch }}-rust1.98-sccache0.16-${{ hashFiles('Cargo.lock', 'Cargo.toml', 'packages/runtime/workerd.lock.json') }}-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            compiler-${{ runner.os }}-${{ runner.arch }}-rust1.98-sccache0.16-${{ hashFiles('Cargo.lock', 'Cargo.toml', 'packages/runtime/workerd.lock.json') }}-${{ github.sha }}-
            compiler-${{ runner.os }}-${{ runner.arch }}-rust1.98-sccache0.16-${{ hashFiles('Cargo.lock', 'Cargo.toml', 'packages/runtime/workerd.lock.json') }}-
      - name: Enable local compiler cache without per-crate remote cache requests
        shell: bash
        run: |
          echo "RUSTC_WRAPPER=sccache" >> "$GITHUB_ENV"
          echo "SCCACHE_DIR=$GITHUB_WORKSPACE/.temp/sccache" >> "$GITHUB_ENV"
          echo "SCCACHE_CACHE_SIZE=512M" >> "$GITHUB_ENV"
      - name: Fetch locked crates for offline packaged-binary tests
        run: cargo fetch --locked
      - name: Package and verify the native single executable
        shell: bash
        env:
          RELEASE_TAG: ${{ needs.validate.outputs.tag }}
          RELEASE_TARGET: ${{ matrix.target }}
        run: |
          set -euo pipefail
          destination="$RUNNER_TEMP/ocd-$RELEASE_TAG-$RELEASE_TARGET"
          report="$RUNNER_TEMP/release-report-$RELEASE_TARGET.json"
          ./scripts/package-release.sh \
            --dest "$destination" \
            --archive "$OPEN_COMPUTE_BUILD_WORKERD_ARCHIVE" | tee "$report"
          REPORT="$report" bun -e '
            const report = await Bun.file(process.env.REPORT).json();
            if (report.schemaVersion !== 1 || report.target !== process.env.RELEASE_TARGET
                || report.version !== process.env.RELEASE_TAG.slice(1)
                || report.revision !== process.env.GITHUB_SHA) {
              throw new Error("packaged release identity does not match the matrix");
            }
          '
          OPEN_COMPUTE_TEST_OCD="$destination" \
            ./test/gate.py single-binary --jobs 1
      - uses: actions/upload-artifact@v7
        with:
          name: release-${{ matrix.target }}
          path: |
            ${{ runner.temp }}/ocd-${{ needs.validate.outputs.tag }}-${{ matrix.target }}
            ${{ runner.temp }}/release-report-${{ matrix.target }}.json
          if-no-files-found: error
          retention-days: 14
          compression-level: 0
      - name: Compiler cache statistics
        if: always()
        run: sccache --show-stats
      - name: Save compiler cache including failed builds
        if: ${{ always() && !cancelled() }}
        uses: actions/cache/save@v6
        with:
          path: .temp/sccache
          key: ${{ steps.compiler-cache.outputs.cache-primary-key }}
      - name: Retain compiler timings
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: build-timings-${{ matrix.target }}
          path: target/cargo-timings/
          if-no-files-found: ignore
      - name: Retain failed native builds for diagnosis and subsequent verification
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: unverified-native-build-${{ matrix.target }}
          path: |
            target/*/release/ocd
            ${{ runner.temp }}/release-report-${{ matrix.target }}.json
          if-no-files-found: ignore
          compression-level: 0
          retention-days: 14
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: package-gate-${{ matrix.target }}
          include-hidden-files: true
          path: |
            .temp/gate-run/
            .temp/**/failed/**/ocd.log

  assemble:
    needs: [validate, package]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - uses: actions/download-artifact@v8
        with:
          pattern: release-*
          path: .temp/release-assets
          merge-multiple: true
      - name: Assemble the immutable release manifest
        env:
          RELEASE_TAG: ${{ needs.validate.outputs.tag }}
        run: bun scripts/assemble-release.ts --tag "$RELEASE_TAG" --dir "$GITHUB_WORKSPACE/.temp/release-assets"
      - uses: actions/upload-artifact@v7
        with:
          name: public-release
          path: |
            .temp/release-assets/ocd-*
            .temp/release-assets/release.json
            .temp/release-assets/SHA256SUMS
          if-no-files-found: error
          retention-days: 14
          compression-level: 0

  publish:
    needs: [validate, assemble, msrv, lint-test, coverage, integration]
    runs-on: ubuntu-24.04
    environment: release
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: public-release
          path: .temp/release-assets
      - name: Create a draft, verify uploaded bytes, and publish
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.validate.outputs.tag }}
          RELEASE_VERSION: ${{ needs.validate.outputs.version }}
        run: |
          set -euo pipefail
          assets="$GITHUB_WORKSPACE/.temp/release-assets"
          mapfile -t files < <(find "$assets" -maxdepth 1 -type f \
            \( -name "ocd-$RELEASE_TAG-*" -o -name SHA256SUMS -o -name release.json \) \
            -print | sort)
          if [ "${#files[@]}" -ne 6 ]; then
            echo "expected four executables, SHA256SUMS, and release.json" >&2
            exit 1
          fi
          gh release create "$RELEASE_TAG" "${files[@]}" \
            --repo "$GITHUB_REPOSITORY" \
            --verify-tag \
            --draft \
            --generate-notes \
            --title "open-compute $RELEASE_VERSION"
          verify="$RUNNER_TEMP/release-download"
          mkdir "$verify"
          gh release download "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --dir "$verify"
          if [ "$(find "$verify" -maxdepth 1 -type f | wc -l | tr -d ' ')" -ne 6 ]; then
            echo "the draft release does not contain the exact asset set" >&2
            exit 1
          fi
          for source in "${files[@]}"; do
            cmp "$source" "$verify/$(basename "$source")"
          done
          (cd "$verify" && sha256sum --check SHA256SUMS)
          gh release edit "$RELEASE_TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --draft=false \
            --latest
