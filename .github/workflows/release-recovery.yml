name: release-recovery

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Stable release tag to recover
        required: true
        type: string
      source_run_id:
        description: Release workflow run containing verified artifacts
        required: true
        type: string

permissions:
  contents: write
  actions: read

jobs:
  recover:
    runs-on: ubuntu-24.04
    environment: release
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
      - name: Validate release recovery tooling
        run: node --test test/release-tools.test.mjs test/release-test-report.test.mjs test/stress.test.mjs
      - name: Validate release environment and npm authentication
        env:
          NPM_ACCESS_TOKEN: ${{ secrets.NPM_ACCESS_TOKEN }}
        run: |
          set -euo pipefail
          test -n "$NPM_ACCESS_TOKEN"
          printf '//registry.npmjs.org/:_authToken=${NPM_ACCESS_TOKEN}\n' > "$RUNNER_TEMP/.npmrc"
          export NPM_CONFIG_USERCONFIG="$RUNNER_TEMP/.npmrc"
          npm whoami --registry https://registry.npmjs.org
      - name: Require successful release evidence
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_RUN_ID: ${{ inputs.source_run_id }}
        run: |
          set -euo pipefail
          state="$(gh run view "$SOURCE_RUN_ID" --repo "$GITHUB_REPOSITORY" --json jobs --jq '
            [.jobs[] | select(.name == "failfast" or .name == "coverage" or .name == "sdk-package" or .name == "stress"
              or (.name | startswith("integration (")) or (.name | startswith("package ("))
              or (.name | startswith("install-lifecycle (")))]
            | group_by(.name) | map(max_by(.databaseId))
            | if length == 14 and all(.conclusion == "success") then "success" else "failed" end')"
          test "$state" = success
      - name: Check out the immutable release source
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_RUN_ID: ${{ inputs.source_run_id }}
          RELEASE_TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          [[ "$RELEASE_TAG" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]
          test "$(git cat-file -t "refs/tags/$RELEASE_TAG")" = tag
          source_run="$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$SOURCE_RUN_ID")"
          test "$(jq -r .path <<< "$source_run")" = .github/workflows/release.yml
          test "$(jq -r .status <<< "$source_run")" = completed
          test "$(jq -r .head_sha <<< "$source_run")" = "$(git rev-parse "refs/tags/$RELEASE_TAG^{}")"
          git checkout --detach "refs/tags/$RELEASE_TAG"
      - uses: actions/download-artifact@v8
        with:
          pattern: release-*
          path: .temp/release-assets
          merge-multiple: true
          run-id: ${{ inputs.source_run_id }}
          github-token: ${{ github.token }}
      - uses: actions/download-artifact@v8
        with:
          name: sdk-package
          path: .temp/sdk-package
          run-id: ${{ inputs.source_run_id }}
          github-token: ${{ github.token }}
      - uses: actions/download-artifact@v8
        with:
          pattern: "{coverage-gate-evidence,gate-evidence-*,package-gate-*,install-lifecycle-*,stress-qualification}"
          path: .temp/release-evidence
          run-id: ${{ inputs.source_run_id }}
          github-token: ${{ github.token }}
      - name: Rebuild the top-level stress suite inventory
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          from pathlib import Path
          path=Path('.temp/release-evidence/stress-qualification/qualification.json')
          report=json.loads(path.read_text())
          profiles={'smoke','p0-2c4g','scenario','p1-2c4g-peak','p1-2c4g-soak'}
          runs=report['runs']
          for run in runs:
              assert run['profile'] in profiles | {'reconcile'} and run['verdict']=='pass'
              assert not run['global_anomalies']
              if run['profile']=='reconcile':
                  for item in [*run['stacks'].values(),*run['scenario'].values()]:
                      assert item['verdict']=='pass' and not item['anomalies']
          stages=[run for run in runs if run['profile'] in profiles]
          assert len(stages)==len(profiles) and {run['profile'] for run in stages}==profiles
          report['runs']=stages
          path.write_text(json.dumps(report,indent=2)+'\n')
          PY
      - name: Assemble verified release assets
        env:
          RELEASE_TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          bun scripts/assemble-release.ts \
            --tag "$RELEASE_TAG" \
            --dir "$GITHUB_WORKSPACE/.temp/release-assets" \
            --sdk-report "$GITHUB_WORKSPACE/.temp/sdk-package/sdk-package-report.json" \
            --evidence "$GITHUB_WORKSPACE/.temp/release-evidence"
      - name: Create draft and verify uploaded bytes
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          assets="$GITHUB_WORKSPACE/.temp/release-assets"
          mapfile -t files < <(find "$assets" -maxdepth 1 -type f \
            \( -name "ocd-$RELEASE_TAG-*" -o -name SHA256SUMS -o -name release.json -o -name test-report.html -o -name test-report.json \) \
            -print | sort)
          test "${#files[@]}" -eq 7
          if gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            test "$(gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --json isDraft --jq .isDraft)" = true
          else
            gh release create "$RELEASE_TAG" "${files[@]}" \
              --repo "$GITHUB_REPOSITORY" --verify-tag --draft \
              --notes-file "$GITHUB_WORKSPACE/docs/releases/${RELEASE_TAG#v}.md" \
              --title "open-compute ${RELEASE_TAG#v}"
          fi
          verify="$RUNNER_TEMP/release-download"
          mkdir "$verify"
          gh release download "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --dir "$verify"
          test "$(find "$verify" -maxdepth 1 -type f | wc -l)" -eq 7
          for source in "${files[@]}"; do cmp "$source" "$verify/$(basename "$source")"; done
          (cd "$verify" && sha256sum --check SHA256SUMS)
      - name: Publish verified SDK tarball to npm
        env:
          NPM_ACCESS_TOKEN: ${{ secrets.NPM_ACCESS_TOKEN }}
          RELEASE_VERSION: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          RELEASE_VERSION="${RELEASE_VERSION#v}"
          report="$GITHUB_WORKSPACE/.temp/sdk-package/sdk-package-report.json"
          tarball=".temp/sdk-package/$(node -p "require('$report').tarball")"
          expected_shasum="$(node -p "require('$report').tarballShasum")"
          expected_integrity="$(node -p "require('$report').tarballIntegrity")"
          printf '//registry.npmjs.org/:_authToken=${NPM_ACCESS_TOKEN}\n' > "$RUNNER_TEMP/.npmrc"
          export NPM_CONFIG_USERCONFIG="$RUNNER_TEMP/.npmrc"
          if ! npm publish "$tarball" --access public --registry https://registry.npmjs.org; then
            read_shasum="$(npm view "@open-compute/sdk@$RELEASE_VERSION" dist.shasum --registry https://registry.npmjs.org 2>/dev/null || true)"
            read_integrity="$(npm view "@open-compute/sdk@$RELEASE_VERSION" dist.integrity --registry https://registry.npmjs.org 2>/dev/null || true)"
            if [ "$read_shasum" != "$expected_shasum" ] || [ "$read_integrity" != "$expected_integrity" ]; then
              echo "npm publish failed and no identical published package was readable" >&2
              exit 1
            fi
          fi
      - name: Publish verified draft
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.tag }}
        run: gh release edit "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --draft=false --latest
