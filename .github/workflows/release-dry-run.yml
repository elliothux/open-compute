name: release-dry-run

on:
  workflow_dispatch:
    inputs:
      ref:
        description: Branch, tag, or commit to package
        required: true
        default: release
        type: string
      target:
        description: Native target to build; all runs the complete package matrix
        required: true
        default: linux-x64
        type: choice
        options:
          - linux-x64
          - linux-arm64
          - darwin-arm64
          - all

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  failfast:
    runs-on: ubuntu-24.04
    outputs:
      package_matrix: ${{ steps.package_matrix.outputs.value }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref }}
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - name: Select the exact package matrix
        id: package_matrix
        env:
          TARGET: ${{ inputs.target }}
        run: |
          case "$TARGET" in
            all) value='{"include":[{"target":"darwin-arm64","os":"macos-15"},{"target":"linux-arm64","os":"ubuntu-24.04-arm"},{"target":"linux-x64","os":"ubuntu-24.04"}]}' ;;
            darwin-arm64) value='{"include":[{"target":"darwin-arm64","os":"macos-15"}]}' ;;
            linux-arm64) value='{"include":[{"target":"linux-arm64","os":"ubuntu-24.04-arm"}]}' ;;
            linux-x64) value='{"include":[{"target":"linux-x64","os":"ubuntu-24.04"}]}' ;;
            *) echo "unsupported package target: $TARGET" >&2; exit 1 ;;
          esac
          echo "value=$value" >> "$GITHUB_OUTPUT"
      - name: Validate source identity and release-tool contracts
        run: |
          bun test/conformance/check.ts --case baseline-identity
          node --test test/release-tools.test.mjs

  package:
    needs: failfast
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.failfast.outputs.package_matrix) }}
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref }}
          fetch-depth: 0
          lfs: true
      - uses: ./.github/actions/setup-open-compute
        with:
          # Reuse main's debug/test target for the single-binary harness.
          rust-cache-key: default-${{ hashFiles('crates/storage/refinery-migrations/**/*.sql') }}
          rust-cache-save: "false"
      - name: Cache release dependency artifacts
        uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: false
          save-if: "true"
          add-job-id-key: false
          shared-key: v3-release-${{ matrix.target }}-${{ hashFiles('crates/storage/refinery-migrations/**/*.sql') }}
          workspaces: ". -> .temp/release-target"
          cache-all-crates: false
      - uses: mozilla-actions/sccache-action@v0.0.11
        with:
          version: v0.16.0
      - name: Restore bounded compiler cache
        id: compiler-cache
        uses: actions/cache/restore@v6
        with:
          path: .temp/sccache
          key: compiler-v2-${{ runner.os }}-${{ runner.arch }}-rust1.98-sccache0.16-${{ hashFiles('Cargo.lock', 'Cargo.toml', 'packages/runtime/workerd.lock.json', 'crates/storage/refinery-migrations/**/*.sql') }}
          restore-keys: |
            compiler-v2-${{ runner.os }}-${{ runner.arch }}-rust1.98-sccache0.16-
      - name: Enable bounded compiler cache
        shell: bash
        run: |
          echo "RUSTC_WRAPPER=sccache" >> "$GITHUB_ENV"
          echo "SCCACHE_DIR=$GITHUB_WORKSPACE/.temp/sccache" >> "$GITHUB_ENV"
          echo "SCCACHE_CACHE_SIZE=512M" >> "$GITHUB_ENV"
      - name: Fetch locked crates for offline packaged-binary tests
        run: cargo fetch --locked
      - name: Package and verify native executable without publishing
        shell: bash
        env:
          RELEASE_TARGET: ${{ matrix.target }}
        run: |
          set -euo pipefail
          version="$(awk '
            $0 == "[workspace.package]" { section = 1; next }
            section && /^\[/ { exit }
            section && /^version = / { value = $0; sub(/^version = "/, "", value); sub(/"$/, "", value); print value; found = 1 }
            END { if (!found) exit 1 }
          ' Cargo.toml)"
          revision="$(git rev-parse --verify HEAD)"
          destination="$RUNNER_TEMP/ocd-v$version-$RELEASE_TARGET"
          report="$GITHUB_WORKSPACE/.temp/release-report-$RELEASE_TARGET.json"
          mkdir -p .temp/dry-run-assets
          export CARGO_TARGET_DIR="$GITHUB_WORKSPACE/.temp/release-target"
          ./scripts/package-release.sh \
            --dest "$destination" \
            --archive "$OPEN_COMPUTE_BUILD_WORKERD_ARCHIVE" | tee "$report"
          REPORT="$report" VERSION="$version" REVISION="$revision" TARGET="$RELEASE_TARGET" \
            bun -e '
              const report = await Bun.file(process.env.REPORT).json();
              if (report.schemaVersion !== 1 || report.version !== process.env.VERSION
                  || report.revision !== process.env.REVISION || report.target !== process.env.TARGET)
                throw new Error("dry-run package identity mismatch");
            '
          unset CARGO_TARGET_DIR RUSTC_WRAPPER SCCACHE_DIR SCCACHE_CACHE_SIZE
          OPEN_COMPUTE_TEST_OCD="$destination" \
          OPEN_COMPUTE_PACKAGE_GATE_USER_ROOT=1 \
            ./test/gate.py single-binary --jobs 1
          cp "$destination" ".temp/dry-run-assets/ocd-v$version-$RELEASE_TARGET"
          cp "$report" ".temp/dry-run-assets/release-report-$RELEASE_TARGET.json"
      - name: Exercise the packaged Dashboard against the candidate executable
        if: matrix.target == 'linux-arm64'
        shell: bash
        env:
          OPEN_COMPUTE_ADMIN_TOKEN: dev-admin-token
          OPEN_COMPUTE_DEPLOYER_TOKEN: dev-deployer-token
          OPEN_COMPUTE_READ_ONLY_TOKEN: dev-read-only-token
          OPEN_COMPUTE_DASHBOARD_E2E_BASE_URL: http://127.0.0.1:18787/operator/
        run: |
          set -euo pipefail
          version="$(awk '
            $0 == "[workspace.package]" { section = 1; next }
            section && /^\[/ { exit }
            section && /^version = / { value = $0; sub(/^version = "/, "", value); sub(/"$/, "", value); print value; found = 1 }
            END { if (!found) exit 1 }
          ' Cargo.toml)"
          evidence="$GITHUB_WORKSPACE/.temp/dashboard-e2e"
          mkdir -p "$evidence"
          candidate="$RUNNER_TEMP/ocd-v$version-linux-arm64"
          uid_home="$(getent passwd "$(id -u)" | cut -d: -f6)"
          [ -n "$uid_home" ]
          OPEN_COMPUTE_OCD_BIN="$candidate" \
          OPEN_COMPUTE_DEV_PRODUCTION_SCOPE=1 \
          OPEN_COMPUTE_DEV_OCD_ROOT="$uid_home/.open-compute" \
            ./scripts/dev-test.sh run >"$evidence/ocd.log" 2>&1 &
          server_pid=$!
          cleanup() {
            kill "$server_pid" 2>/dev/null || true
            wait "$server_pid" 2>/dev/null || true
          }
          trap cleanup EXIT
          apps/dashboard/node_modules/.bin/playwright install --with-deps chromium
          bun run test:dashboard:e2e
      - name: Compiler cache statistics
        if: always()
        run: sccache --show-stats
      - name: Save compiler cache
        if: ${{ always() && !cancelled() && steps.compiler-cache.outputs.cache-hit != 'true' }}
        continue-on-error: true
        uses: actions/cache/save@v6
        with:
          path: .temp/sccache
          key: ${{ steps.compiler-cache.outputs.cache-primary-key }}
      - name: Retain compiler timings
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: dry-run-build-timings-${{ matrix.target }}
          path: .temp/release-target/cargo-timings/
          if-no-files-found: ignore
          retention-days: 3
      - uses: actions/upload-artifact@v7
        with:
          name: dry-run-${{ matrix.target }}
          path: |
            .temp/dry-run-assets
            .temp/dashboard-e2e
            apps/dashboard/test-results
          if-no-files-found: error
          retention-days: 3
          compression-level: 0

  sdk:
    needs: failfast
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref }}
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - name: Install locked JavaScript dependencies
        run: bun install --frozen-lockfile --ignore-scripts
      - name: Build and inspect SDK without publishing
        run: |
          bun run --filter @open-compute/sdk typecheck
          bun run --filter @open-compute/sdk test
          bun run --filter @open-compute/sdk build
          bun packages/sdk/scripts/inspect-package.ts
      - uses: actions/upload-artifact@v7
        with:
          name: dry-run-sdk
          path: .temp/sdk-package
          if-no-files-found: error
          retention-days: 3

  assemble:
    if: inputs.target == 'all'
    needs: [package, sdk]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref }}
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - uses: actions/download-artifact@v8
        with:
          name: dry-run-darwin-arm64
          path: .temp/release-assets
      - uses: actions/download-artifact@v8
        with:
          name: dry-run-linux-arm64
          path: .temp/release-assets
      - uses: actions/download-artifact@v8
        with:
          name: dry-run-linux-x64
          path: .temp/release-assets
      - uses: actions/download-artifact@v8
        with:
          name: dry-run-sdk
          path: .temp/sdk-package
      - name: Assemble and verify release manifest without publishing
        run: |
          set -euo pipefail
          version="$(awk '
            $0 == "[workspace.package]" { section = 1; next }
            section && /^\[/ { exit }
            section && /^version = / { value = $0; sub(/^version = "/, "", value); sub(/"$/, "", value); print value; found = 1 }
            END { if (!found) exit 1 }
          ' Cargo.toml)"
          mkdir -p .temp/assembled
          bun scripts/assemble-release.ts \
            --tag "v$version" \
            --dir "$GITHUB_WORKSPACE/.temp/release-assets" \
            --sdk-report "$GITHUB_WORKSPACE/.temp/sdk-package/sdk-package-report.json"
          cp .temp/release-assets/release.json .temp/assembled/
          cp .temp/release-assets/SHA256SUMS .temp/assembled/
          (cd .temp/release-assets && sha256sum --check SHA256SUMS)
      - uses: actions/upload-artifact@v7
        with:
          name: dry-run-assembled
          path: .temp/assembled
          if-no-files-found: error
          retention-days: 3
