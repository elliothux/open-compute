[server]
public_bind = "127.0.0.1:8787"
admin_auth = { env = "OPEN_COMPUTE_ADMIN_TOKEN" }
deployer_auth = { env = "OPEN_COMPUTE_DEPLOYER_TOKEN" }
read_only_auth = { env = "OPEN_COMPUTE_READ_ONLY_TOKEN" }

[data]
path = "../../.data/open-compute/platform"
master_key_file = "../../.data/open-compute/platform/keys/master.key"

[storage]
backend = "local"
path = "../../.data/open-compute/platform/objects"
prefix = "system/"
r2_prefix = "tenant/r2/"

[dashboard]
enabled = true
